input.pz-input,textarea.pz-input,select.pz-input{

const MONTHS_PT = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

const pad2 = (n) => String(n).padStart(2, "0");
const addDays = (date, n) => { const d = new Date(date); d.setDate(d.getDate() + n); return d; };
const normDow = (s) => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().slice(0, 3);
const formatRange = (start, end) => {
  const sD = pad2(start.getDate()), eD = pad2(end.getDate());
  const sM = MONTHS_PT[start.getMonth()], eM = MONTHS_PT[end.getMonth()];
  return sM === eM ? `${sD}–${eD} ${sM}` : `${sD} ${sM}–${eD} ${eM}`;
};
const formatDatePt = (d) => `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
const secToClock = (totalSec) => {
  if (!isFinite(totalSec) || totalSec <= 0) return "--:--";
  const s = Math.round(totalSec);
  const m = Math.floor(s / 60), r = s % 60;
  return `${pad2(m)}:${pad2(r)}`;
};
const calcAge = (birthDateStr) => {
  if (!birthDateStr) return null;
  const y = Number(String(birthDateStr).slice(0, 4));
  if (!y) return null;
  return new Date().getFullYear() - y;
};
const titleCase = (s) => (s ? s.charAt(0) + s.slice(1).toLowerCase() : "");

const ZONE_DEFS = [
  { key: "Z1", pct: 0.65, label: "Muito Leve" },
  { key: "Z2", pct: 0.75, label: "Leve" },
  { key: "Z3", pct: 0.85, label: "Moderado" },

  { key: "Z5", pct: 1.00, label: "Muito Forte" },
];

// Faixa (min/max %) de cada zona — ponto médio entre zonas vizinhas. É o que
// permite mostrar uma FAIXA de pace/FC por zona (não só um valor pontual),
// pra aplicar direto numa sessão como "frequência mínima e máxima".
const ZONE_BOUNDS = ZONE_DEFS.map((z, i) => {
  const prev = ZONE_DEFS[i - 1];
  const next = ZONE_DEFS[i + 1];
  const lower = prev ? (prev.pct + z.pct) / 2 : z.pct - 0.05;
  const upper = next ? (z.pct + next.pct) / 2 : z.pct + 0.05;
  return { lower, upper };
});

const ageBand = (age) => {
  if (age < 20) return "13-19";
  if (age < 30) return "20-29";
  if (age < 40) return "30-39";
  if (age < 50) return "40-49";
  if (age < 60) return "50-59";
  return "60+";
};
const classifyVO2 = (vo2, age, sex) => {
  const table = VO2_TABLE[sex === "F" ? "F" : "M"];
  const bounds = table[ageBand(age)];
  let idx = 0;
  for (let i = 0; i < bounds.length; i++) { if (vo2 >= bounds[i]) idx = i; }
  return VO2_LEVELS[idx];
};

// Fórmulas exatas de cada protocolo (aba ZONAS da planilha RX-PRO).
function computeProtocol(key, inputs) {
  const min = Number(inputs.min) || 0;
  const sec = Number(inputs.sec) || 0;
  const distKm = Number(inputs.distKm) || 0;
  const testSec0 = min * 60 + sec;
  let testKm, testSec, vo2max, vam = null;

  switch (key) {
    case "weltmann":
      if (testSec0 <= 0) return null;
      testKm = 3.2; testSec = testSec0;
      vo2max = 118.4 - 4.774 * (testSec / 60);
      break;
    case "cooper2400":
      if (testSec0 <= 0) return null;
      testKm = 2.4; testSec = testSec0;
      vo2max = (2400 * 12 + 3.5) / testSec;
      break;
    case "cooper12min":
      if (distKm <= 0) return null;
      testKm = distKm; testSec = 720;
      vo2max = (distKm * 1000 - 504) / 44.73;
      break;
    case "dabonneville":
      if (distKm <= 0) return null;
      testKm = distKm; testSec = 300;
      vo2max = (distKm * 1000 / 5) * 0.2 + 3.5;
      break;
    case "vo2pro": {
      if (distKm <= 0 || testSec0 <= 0) return null;
      testKm = distKm; testSec = testSec0;
      const paceSec = testSec / distKm;
      const equivSec = paceSec * 3.2;
      vo2max = 118.4 - 4.774 * (equivSec / 60);
      break;
    }
    case "almeida": {
      if (testSec0 <= 0) return null;
      testKm = 1.6; testSec = testSec0;
      const decMin = testSec / 60;
      vo2max = (1600 / decMin) * 0.177 + 8.101;
      vam = vo2max / 3.5;
      break;
    }
    case "critica": {
      if (testSec0 <= 0) return null;
      testKm = 3; testSec = testSec0;
      const velKmH = (testKm * 3600) / testSec;
      vo2max = velKmH * 3.5;
      break;
    }
    default:
      return null;
  }
  if (!isFinite(vo2max) || vo2max <= 0) return null;
  return { testKm, testSec, vo2max, vam };
}

function paceZonesFrom(testKm, testSec) {
  const basePace = testSec / testKm; // segundos/km no esforço do teste (100%)
  return ZONE_DEFS.map((z, i) => {
    const paceSec = basePace / z.pct;
    const bounds = ZONE_BOUNDS[i];
    const paceMaxSec = basePace / bounds.lower; // % menor => pace mais lento (tempo maior)
    const paceMinSec = basePace / bounds.upper; // % maior => pace mais rápido (tempo menor)
    return {
      ...z,
      paceSec,
      paceLabel: secToClock(paceSec),
      kmh: +(3600 / paceSec).toFixed(2),
      paceMinLabel: secToClock(paceMinSec),
      paceMaxLabel: secToClock(paceMaxSec),
    };
  });
}
function hrZonesFrom(hrMaxVal) {
  return ZONE_DEFS.map((z, i) => {
    const bounds = ZONE_BOUNDS[i];
    return {
      ...z,
      bpm: Math.round(hrMaxVal * z.pct),
      bpmMin: Math.round(hrMaxVal * bounds.lower),
      bpmMax: Math.round(hrMaxVal * bounds.upper),
    };
  });
}

// Combina zona de pace + zona de FC num formato pronto pra aplicar direto
// numa sessão: pace (ponto) e frequência (faixa mínima–máxima).
function buildZoneOptions(result) {
  if (!result) return [];
  return result.paceZones.map((pz, i) => {
    const hz = result.hrZones ? result.hrZones[i] : null;
    return {
      key: pz.key,
      label: `${pz.key} · ${pz.label}`,
      paceText: `${pz.paceLabel}/km`,
      freqText: hz ? `${hz.bpmMin}–${hz.bpmMax} bpm` : "",
    };
  });
}

// Função pura: dado um plano, calcula VO2máx + zonas (sem guardar estado derivado).
function getVO2Result(plan) {
  const protocol = plan.vo2Protocol || "vo2pro";
  const inputs = (plan.vo2Inputs && plan.vo2Inputs[protocol]) || {};
  const base = computeProtocol(protocol, inputs);
  if (!base) return null;
  const age = calcAge(plan.birthDate);
  const sex = plan.sex === "F" ? "F" : "M";
  const level = age ? classifyVO2(base.vo2max, age, sex) : null;
  const paceZones = paceZonesFrom(base.testKm, base.testSec);
  const hrMax = Number(plan.hrMax) || 0;
  const hrZones = hrMax > 0 ? hrZonesFrom(hrMax) : null;
  return { ...base, age, sex, level, paceZones, hrZones, hrMax };
}

function round1(n) { return Math.round(n * 10) / 10; }

function distribuirSemanasMeso(total, nMeso, taperWeeks) {
  const resto = total - taperWeeks;
  const base = Math.floor(resto / (nMeso - 1));
  const sobra = resto - base * (nMeso - 1);
  const arr = [];
  for (let i = 0; i < nMeso - 1; i++) arr.push(base + (i < sobra ? 1 : 0));
  arr.push(taperWeeks);
  return arr;
}

// Mesociclos: curva de %volume em sino (sobe, platô, cai no taper/polimento).
function gerarMesociclos(prova, totalSemanas, cfg) {
  const nMeso = totalSemanas <= 8 ? 3 : totalSemanas <= 14 ? 4 : totalSemanas <= 20 ? 5 : 6;
  const taperWeeks = prova >= 42 ? 3 : prova >= 21 ? 2 : 1 + cfg.taperExtra;
  const nomesFase = ["Introdutório", "Desenvolvimento", "Específico", "Pico", "Manutenção", "Polimento"];

  let curva = [];
  if (nMeso === 3) curva = [0.80, 1.00, 0.60];
  else if (nMeso === 4) curva = [0.80, 0.95, 1.00, 0.65];
  else if (nMeso === 5) curva = [0.75, 0.90, 1.00, 0.95, 0.60];
  else curva = [0.70, 0.85, 0.95, 1.00, 0.90, 0.55];

  const semanasPorMeso = distribuirSemanasMeso(totalSemanas, nMeso, taperWeeks);
  const fases = [];
  for (let i = 0; i < nMeso; i++) {
    fases.push({
      nome: i === nMeso - 1 ? "Polimento (Taper)" : (nomesFase[i] || `Bloco ${i + 1}`),
      pct: curva[i],
      semanas: semanasPorMeso[i],
      isTaper: i === nMeso - 1,
    });
  }
  return fases;
}

// Semanas: volume progressivo com deload a cada 4 semanas + taper no final.
function gerarSemanasMeso(mesociclos, volumeAtual, picoVolume, freq, prova) {
  const semanas = [];
  let semanaGlobal = 1;
  const totalBuildWeeks = mesociclos.filter((m) => !m.isTaper).reduce((s, m) => s + m.semanas, 0);

  mesociclos.forEach((meso, mi) => {
    for (let w = 0; w < meso.semanas; w++) {
      let volKm;
      if (meso.isTaper) {
        const isRaceWeek = w === meso.semanas - 1;
        const taperProgress = meso.semanas === 1 ? 1 : w / (meso.semanas - 1);
        const minFactor = 0.45, maxFactor = 0.80;
        const factor = maxFactor - taperProgress * (maxFactor - minFactor);
        volKm = isRaceWeek ? picoVolume * minFactor : picoVolume * factor;
      } else {
        const progressoGlobal = (semanaGlobal - 1) / Math.max(1, totalBuildWeeks - 1);
        let vol = volumeAtual + (picoVolume - volumeAtual) * progressoGlobal;
        if (semanaGlobal % 4 === 0) vol *= 0.82;
        volKm = vol;
      }
      volKm = Math.round(volKm);

      let tag = "build";
      if (mi === 0) tag = "intro";
      else if (meso.isTaper) tag = "taper";
      else if (mi === mesociclos.length - 2) tag = "peak";

      const isRaceWeek = meso.isTaper && w === meso.semanas - 1;
      const isDeload = !meso.isTaper && semanaGlobal % 4 === 0;
      if (isDeload) tag = "deload";

      semanas.push({ numero: semanaGlobal, mesociclo: meso.nome, km: volKm, tag: isRaceWeek ? "race" : tag, isRaceWeek });
      semanaGlobal++;
    }
  });
  return semanas;
}

// Distribuição dos dias da semana (baseado em frequência e tipo de semana).
function gerarDiasSemanaMeso(semanaObj, freq, prova) {
  const km = semanaObj.km;
  const dist = INTENSITY_BY_RACE[prova];
  const dias = [];

  const slotsPorFreq = { 3: [1, 3, 6], 4: [1, 3, 5, 6], 5: [1, 2, 4, 5, 6], 6: [1, 2, 3, 4, 5, 6], 7: [0, 1, 2, 3, 4, 5, 6] };
  const slots = slotsPorFreq[freq] || slotsPorFreq[5];

  if (semanaObj.isRaceWeek) {
    const easyDays = slots.slice(0, Math.max(1, slots.length - 2));
    const kmEasyTotal = km * 0.5;
    easyDays.forEach((d) => dias.push({ dow: d, tipo: "Rodagem leve", classe: "easy", km: round1(kmEasyTotal / easyDays.length) }));
    dias.push({ dow: slots[slots.length - 1], tipo: `PROVA — ${prova} km`, classe: "race", km: prova });
    return dias.sort((a, b) => a.dow - b.dow);
  }

  const isDeload = semanaObj.tag === "deload";
  const kmLonga = round1(km * (prova >= 21 ? 0.32 : 0.28) * (isDeload ? 0.85 : 1));
  const temQualidade = (semanaObj.tag !== "intro" && !isDeload) || freq >= 4;
  const kmQualidade = temQualidade ? round1(km * (dist.T + dist.I + dist.R + 0.03)) : 0;

  let kmRestante = km - kmLonga - kmQualidade;
  const nEasyDays = slots.length - (temQualidade ? 2 : 1);
  const kmPorEasy = nEasyDays > 0 ? round1(kmRestante / nEasyDays) : 0;

  slots.forEach((d, idx) => {
    const isLast = idx === slots.length - 1;
    const isQualityDay = temQualidade && idx === Math.floor(slots.length / 2);
    if (isLast) {
      dias.push({ dow: d, tipo: "Rodagem longa", classe: "long", km: kmLonga });
    } else if (isQualityDay) {
      const tipoQualidade = semanaObj.tag === "peak" || semanaObj.tag === "build"
        ? (prova <= 10 ? "Intervalado" : "Tiros em ritmo de limiar")
        : "Ritmo de limiar (contínuo)";
      const classeQualidade = tipoQualidade === "Intervalado" ? "interval" : "threshold";
      dias.push({ dow: d, tipo: tipoQualidade, classe: classeQualidade, km: kmQualidade });
    } else {
      dias.push({ dow: d, tipo: "Rodagem leve / regenerativo", classe: "easy", km: kmPorEasy });
    }
  });
  return dias.sort((a, b) => a.dow - b.dow);
}

// Classe do dia (motor) -> tipo de treino do plano (TYPES).
const MESO_CLASSE_TO_TYPE = { easy: "easy", long: "long", threshold: "quality", interval: "quality", race: "race" };

// Roda o motor completo e devolve as semanas já no formato do plano
// (cells + sessions), prontas pra substituir plan.weeks.
function gerarMacrocicloParaPlano({ prova, volumeAtual, freq, nivel, totalSemanas, blockStartDate }) {
  const cfg = NIVEL_CONFIG[nivel];
  const picoVolume = Math.round(volumeAtual * cfg.picoMult);
  const mesociclos = gerarMesociclos(prova, totalSemanas, cfg);
  const semanasMeso = gerarSemanasMeso(mesociclos, volumeAtual, picoVolume, freq, prova);

  const weeks = semanasMeso.map((s, wi) => {
    const dias = gerarDiasSemanaMeso(s, freq, prova);
    const week = newWeek(s.numero);
    const cells = week.cells.map((c) => ({ ...c }));
    const sessions = [];

    dias.forEach((d) => {
      const cellIdx = MESO_DOW_TO_CELL_INDEX[d.dow];
      const planType = MESO_CLASSE_TO_TYPE[d.classe] || "easy";
      cells[cellIdx] = { ...cells[cellIdx], type: planType, micro: `${d.km}km` };
      sessions.push({
        ...newSession(),
        dow: WEEKDAYS[cellIdx],
        type: planType,
        tagText: d.tipo,
        title: d.tipo,
        km: d.km,
      });
    });

    let tag = `Semana ${s.numero} · ${MESO_TAG_LABELS[s.tag] || s.tag}`;
    if (blockStartDate) {
      const wStart = addDays(new Date(blockStartDate + "T00:00:00"), wi * 7);
      const wEnd = addDays(wStart, 6);
      tag = `Semana ${s.numero} · ${formatRange(wStart, wEnd)} · ${MESO_TAG_LABELS[s.tag] || s.tag}`;
      cells.forEach((c, ci) => { cells[ci] = { ...c, date: pad2(addDays(wStart, ci).getDate()) }; });
      sessions.forEach((sess, si) => {
        const off = WEEKDAYS.indexOf(sess.dow);
        if (off < 0) return;
        const d = addDays(wStart, off);
        sessions[si] = { ...sess, date: `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}` };
      });
    }

    return { ...week, tag, title: s.mesociclo, cells, sessions };
  });

  return weeks;
}

// automaticamente o total semanal exibido no editor e na prévia.
const weekVolumeKm = (week) => (week.sessions || []).reduce((sum, s) => sum + (Number(s.km) || 0), 0);
const fmtKm = (n) => (Math.round(n * 10) / 10).toString().replace(".", ",");

});

// Gera a faixa de 7 dias já com as datas certas a partir da data de início do
// bloco + índice da semana (0-based). Preenche cells[].date; o dia da semana
// (Seg–Dom) é sempre exibido no StripCell independente disso.
const newWeekWithDates = (n, blockStartDate, weekIdx) => {
  const w = newWeek(n);
  if (!blockStartDate) return w;
  const wStart = addDays(new Date(blockStartDate + "T00:00:00"), weekIdx * 7);
  const wEnd = addDays(wStart, 6);
  const cells = w.cells.map((c, ci) => ({ ...c, date: pad2(addDays(wStart, ci).getDate()) }));
  return { ...w, tag: `Semana ${n} · ${formatRange(wStart, wEnd)}`, cells };
};

function togglePeriodOpen() { periodOpen = !periodOpen; render(); }
function setPeriodField(field, value) { periodForm[field] = value; if (field !== 'nivel') return; render(); }
function setPeriodFieldNoRender(field, value) { periodForm[field] = value; }
function gerarMacrociclo() {
  const p = getPlan(); if (!p) return;
  periodForm.error = '';
  const prova = Number(periodForm.prova), vol = Number(periodForm.volumeAtual), freq = Number(periodForm.freq), s = Number(periodForm.totalSemanas);
  if (!vol || vol < 5) { periodForm.error = 'Informe um volume semanal válido (mín. 5 km).'; render(); return; }
  if (!freq || freq < 3 || freq > 7) { periodForm.error = 'Frequência deve ser entre 3 e 7 treinos/semana.'; render(); return; }
  if (!s || s < 6) { periodForm.error = 'O macrociclo precisa de pelo menos 6 semanas.'; render(); return; }
  if (prova >= 21 && s < 10) { periodForm.error = 'Para 21km/42km, recomenda-se um macrociclo de pelo menos 10 semanas.'; render(); return; }
  const hasContent = p.weeks.some((w) => w.sessions.some((sess) => sess.title || sess.detail || sess.code));
  if (hasContent && !confirm('Isso vai SUBSTITUIR todas as semanas atuais deste plano pelo macrociclo gerado. Continuar?')) return;
  const weeks = gerarMacrocicloParaPlano({ prova, volumeAtual: vol, freq, nivel: periodForm.nivel, totalSemanas: s, blockStartDate: p.blockStartDate });
  p.weeks = weeks;
  periodOpen = false;
  persistPlan(p);
}

/* ==================================================================== */
/*  CALENDÁRIO DO BLOCO                                                 */
/* ==================================================================== */
function gerarCalendario() {
  const p = getPlan(); if (!p || !p.blockStartDate) return;
  const start = new Date(p.blockStartDate + 'T00:00:00');
  const n = p.weeks.length;
  p.weeks = p.weeks.map((w, i) => {
    const wStart = addDays(start, i * 7); const wEnd = addDays(wStart, 6);
    const cells = w.cells.map((c, ci) => ({ ...c, date: pad2(addDays(wStart, ci).getDate()) }));
    const sessions = w.sessions.map((s) => {
      const off = DOW_OFFSET[normDow(s.dow)]; if (off === undefined) return s;
      const d = addDays(wStart, off);
      return { ...s, date: pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) };
    });
    return { ...w, tag: 'Semana ' + (i + 1) + ' · ' + formatRange(wStart, wEnd), cells, sessions };
  });
  persistPlan(p);
}

function loadHtml2Pdf() {
  return new Promise((resolve, reject) => {
    if (window.html2pdf) { resolve(window.html2pdf); return; }
    let s = document.querySelector('script[data-lib="html2pdf"]');
    if (s) { s.addEventListener('load', () => resolve(window.html2pdf)); s.addEventListener('error', () => reject(new Error('load-fail'))); return; }
    s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.dataset.lib = 'html2pdf';
    s.onload = () => resolve(window.html2pdf);
    s.onerror = () => reject(new Error('load-fail'));
    document.head.appendChild(s);
  });
}
async function downloadPdf() {
  const p = getPlan(); if (!p) return;
  const node = document.getElementById('printArea'); if (!node) return;
  pdfState = 'loading'; renderPdfButtons();
  try {
    const html2pdf = await loadHtml2Pdf();
    const filename = (p.name || p.athleteName || 'plano').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'plano';
    await html2pdf().set({
      margin: 0, filename: filename + '.pdf',
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, backgroundColor: '#14161A', useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] },
    }).from(node).save();
    pdfState = 'idle';
  } catch (e) { pdfState = 'error'; setTimeout(() => { pdfState = 'idle'; renderPdfButtons(); }, 3500); }
  renderPdfButtons();
}
function renderPdfButtons() {
  const el = document.getElementById('pdfBtnWrap');
  if (el) el.innerHTML = pdfButtonsHtml();
}

    <div class="grid grid-cols-2 gap-3 mb-3">
      ${fieldHtml('Nome do aluno', `<input class="pz-input" value="${esc(p.athleteName)}" oninput="updatePlanField('athleteName',this.value)" placeholder="Pedro Henrique Oliveira Costa"/>`)}

    </div>
    ${fieldHtml('Protocolo de teste utilizado', `<select class="pz-input mb-3" onchange="updatePlanFieldAndRender('vo2Protocol',this.value)">${PROTOCOLS.map((pr) => `<option value="${pr.key}" ${pr.key === protocol ? 'selected' : ''}>${pr.label}</option>`).join('')}</select>`)}
    ${fieldsHtml}

    body = `<div class="p-4">

        ${fieldHtml('Tag da semana', `<input class="pz-input" value="${esc(week.tag)}" oninput="updateWeekField('${week.id}','tag',this.value)" placeholder="Semana 1 · 03–09 ago"/>`)}

            <span class="pz-mono text-[11px]" style="color:${C.paperDim}">Volume calculado: <b style="color:${C.hivis}">${fmtKm(volume)} km</b></span>

        <span class="pz-display text-[13px] uppercase" style="color:${C.paper}">${esc(week.tag) || 'Semana ' + (index + 1)}${week.title ? ' — ' + esc(week.title) : ''}</span>
        ${volume > 0 ? `<span class="pz-mono text-[11px] px-1.5 py-0.5 rounded shrink-0" style="background:rgba(212,255,61,0.12);color:${C.hivis}">${fmtKm(volume)} km</span>` : ''}

function renderStrategyEditor(p) {
  const groups = p.strategyGroups.map((g, gi) => {
    const items = g.items.map((it, ii) => `<div class="flex gap-2">
      <input class="pz-input" style="max-width:70px" value="${esc(it.num)}" oninput="updateStrategyItem(${gi},${ii},'num',this.value)" placeholder="1-2"/>
      <input class="pz-input" value="${esc(it.text)}" oninput="updateStrategyItem(${gi},${ii},'text',this.value)" placeholder="4:55-5:00/km — controlado."/>
      ${iconBtnHtml(`removeStrategyItem(${gi},${ii})`, '✕', 'danger')}
    </div>`).join('');
    return `<div class="p-3 rounded" style="background:${C.ink};border:1px solid ${C.line}">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[11px] uppercase tracking-wider" style="color:${C.paperDim}">Bloco ${gi + 1}</span>
        <div class="flex gap-1">${iconBtnHtml(`addStrategyItem(${gi})`, '＋ item', 'accent')}${iconBtnHtml(`removeStrategyGroup(${gi})`, '✕', 'danger')}</div>
      </div>
      <div class="space-y-2">${items}</div>
    </div>`;
  }).join('');
  const inner = `${fieldHtml('Título da seção', `<input class="pz-input mb-3" value="${esc(p.strategyTitle)}" oninput="updatePlanField('strategyTitle',this.value)" placeholder="Pacing km a km"/>`)}
    <div class="space-y-4">${groups}</div>`;
  return sectionCardHtml('Estratégia de prova', iconBtnHtml('addStrategyGroup()', '＋ bloco', 'accent'), inner);
}
function updateStrategyItem(gi, ii, field, value) { const p = getPlan(); if (!p) return; p.strategyGroups[gi].items[ii][field] = value; persistPlan(p, true); }
function addStrategyItem(gi) { const p = getPlan(); if (!p) return; p.strategyGroups[gi].items.push(newStrategyItem()); persistPlan(p); }
function removeStrategyItem(gi, ii) { const p = getPlan(); if (!p) return; p.strategyGroups[gi].items.splice(ii, 1); persistPlan(p); }
function addStrategyGroup() { const p = getPlan(); if (!p) return; p.strategyGroups.push(newStrategyGroup()); persistPlan(p); }
function removeStrategyGroup(gi) { const p = getPlan(); if (!p) return; p.strategyGroups.splice(gi, 1); persistPlan(p); }

}

    </div>`).join('');
    resultHtml = `<div class="grid grid-cols-2 gap-px mt-2 mb-4" style="background:${C.line};border:1px solid ${C.line}">
        <div class="p-3.5" style="background:${C.ink}"><div class="pz-display font-semibold text-[22px]" style="color:${C.hivis}">${result.vo2max.toFixed(1)}</div><div class="text-[10.5px] uppercase tracking-wider mt-1.5" style="color:${C.paperDim}">VO2máx ml/kg/min${result.level ? ' · ' + result.level : ''}</div></div>
        <div class="p-3.5" style="background:${C.ink}"><div class="pz-display font-semibold text-[22px]" style="color:${C.hivis}">${esc(p.hrMax) || '—'}</div><div class="text-[10.5px] uppercase tracking-wider mt-1.5" style="color:${C.paperDim}">FC máxima (bpm)</div></div>
      </div>
      <div class="grid gap-px" style="background:${C.line};border:1px solid ${C.line}">${rows}</div>`;
  }
  return `<div class="pt-11">
    <div class="pz-mono text-[12px] uppercase tracking-widest mb-1.5" style="color:${C.hivisDim}">Perfil & zonas de treino</div>
    ${(p.athleteName || p.objective) ? `<div class="mb-4">${p.athleteName ? `<div class="pz-display text-[22px] font-semibold" style="color:${C.paper}">${esc(p.athleteName)}</div>` : ''}${p.objective ? `<div class="text-[14px]" style="color:${C.paperDim}">${esc(p.objective)}</div>` : ''}</div>` : ''}
    ${resultHtml}
  </div>`;
}
function previewWeekHtml(week, index) {
  const volume = weekVolumeKm(week);
  return `<div class="pt-11">
    <div class="flex items-center justify-between gap-2 flex-wrap mb-1.5">
      <div class="pz-mono text-[12px] uppercase tracking-widest" style="color:${C.hivisDim}">${esc(week.tag) || 'Semana ' + (index + 1)}</div>
      ${volume > 0 ? `<div class="pz-mono text-[12px] uppercase tracking-widest px-2.5 py-1 rounded-full" style="background:rgba(212,255,61,0.12);color:${C.hivis}">${fmtKm(volume)} km na semana</div>` : ''}
    </div>
    <div class="pz-display text-[26px] font-semibold mb-3" style="color:${C.paper};letter-spacing:-0.5px">${esc(week.title)}</div>
    <div class="rounded p-4 mt-2" style="background:${C.ink2};border:1px solid ${C.line}">
      <div class="text-[11px] uppercase tracking-wider mb-3" style="color:${C.paperDim}">${esc(week.stripCaption)}</div>
      <div class="grid grid-cols-7 gap-1.5">${week.cells.map(previewCellHtml).join('')}</div>
    </div>
    <div class="pz-mono text-[12px] uppercase tracking-widest mt-8 mb-2 pt-4" style="color:${C.hivis};border-top:1px solid ${C.line}">Sessões da semana</div>
    ${week.sessions.map(dayCardHtml).join('')}
  </div>`;
}
function renderPreviewPage(p) {
  const statsHtml = p.stats.some((s) => s.value || s.label) ? `<div class="grid grid-cols-3 gap-px mt-7" style="background:${C.line};border:1px solid ${C.line}">
    ${p.stats.map((s) => `<div class="p-3.5" style="background:${C.ink}"><div class="pz-display font-semibold text-[22px]" style="color:${C.hivis}">${esc(s.value)}</div><div class="text-[10.5px] uppercase tracking-wider mt-1.5" style="color:${C.paperDim}">${esc(s.label)}</div></div>`).join('')}
  </div>` : '';
  const strategyHtml = p.strategyGroups.some((g) => g.items.some((it) => it.text)) ? `<div class="pt-11">
    <div class="pz-mono text-[12px] uppercase tracking-widest mb-1.5" style="color:${C.hivisDim}">Execução no dia</div>
    <div class="pz-display text-[26px] font-semibold mb-3" style="color:${C.paper};letter-spacing:-0.5px">${esc(p.strategyTitle)}</div>
    <div class="space-y-5">${p.strategyGroups.map((g) => `<div class="grid gap-px" style="background:${C.line};border:1px solid ${C.line}">${g.items.map((it) => `<div class="grid gap-3.5 p-4" style="grid-template-columns:28px 1fr;background:${C.ink2}"><div class="pz-mono font-bold text-[14px]" style="color:${C.hivis}">${esc(it.num)}</div><div class="text-[14px] leading-relaxed" style="color:${C.paperDim}">${esc(it.text)}</div></div>`).join('')}</div>`).join('')}</div>
  </div>` : '';
  return `<div id="printArea" class="pz-print-area max-w-[760px] mx-auto px-5 pb-20" style="background:${C.ink}">
    <div class="pt-12 pb-8" style="border-bottom:1px solid ${C.line}">
      <div class="pz-mono text-[13px] uppercase mb-4" style="color:${C.hivisDim};letter-spacing:2px">${esc(p.bibLabel)}</div>
      <div class="pz-display font-bold" style="color:${C.paper};font-size:clamp(56px,14vw,96px);line-height:0.9;letter-spacing:-1px">${esc(p.countdownNumber)}<span class="uppercase font-semibold ml-2.5" style="font-size:0.28em;color:${C.hivis};letter-spacing:2px">${esc(p.countdownUnit)}</span></div>
      ${p.heroSub ? `<p class="mt-3.5 max-w-[520px] leading-relaxed text-[16px]" style="color:${C.paperDim}">${esc(p.heroSub)}</p>` : ''}
      ${statsHtml}
    </div>
    ${profileBlockHtml(p)}
    ${p.weeks.map(previewWeekHtml).join('')}
    ${strategyHtml}
    ${p.footerNote ? `<div class="text-center pz-mono text-[11px] mt-10 pt-6" style="color:${C.paperDim};letter-spacing:1px">${esc(p.footerNote)}</div>` : ''}
  </div>`;
}

/* ==================================================================== */
/*  SHELL DO PLANO (toolbar + editor/prévia)                            */
/* ==================================================================== */
function pdfButtonsHtml() {
  return `<button onclick="downloadPdf()" ${pdfState === 'loading' ? 'disabled' : ''} class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[12px] pz-display uppercase" style="background:${C.hivis};color:${C.ink};opacity:${pdfState === 'loading' ? 0.6 : 1}">
    ${pdfState === 'loading' ? '⏳ Gerando PDF...' : '⬇ Baixar PDF'}
  </button>
  <button onclick="window.print()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[12px] pz-display uppercase" style="background:${C.ink2};color:${C.paper};border:1px solid ${C.line}">🖨 Imprimir</button>`;
}
function renderPlanShell(p) {
  const toolbar = `<div class="pz-no-print sticky top-0 z-10 flex items-center justify-between px-5 py-3 flex-wrap gap-2" style="background:#0F1113;border-bottom:1px solid ${C.line}">
    <div class="flex items-center gap-3">
      <button onclick="backToRoster()" class="flex items-center gap-1.5 text-[13px]" style="color:${C.paperDim}">‹ Planos</button>
      <span style="color:${C.line}">/</span>
      <span class="pz-display text-[14px] uppercase" style="color:${C.paper}">${esc(p.name || p.athleteName || 'Plano sem nome')}</span>
    </div>
    <div class="flex items-center gap-2">
      <span id="saveIndicator" class="text-[11px]" style="color:${C.paperDim}"></span>
      <div class="flex rounded-md overflow-hidden" style="border:1px solid ${C.line}">
        <button onclick="setMode('edit')" class="px-3 py-1.5 text-[12px] pz-display uppercase" style="background:${mode === 'edit' ? C.hivis : 'transparent'};color:${mode === 'edit' ? C.ink : C.paperDim}">Editar</button>
        <button onclick="setMode('preview')" class="px-3 py-1.5 text-[12px] pz-display uppercase" style="background:${mode === 'preview' ? C.hivis : 'transparent'};color:${mode === 'preview' ? C.ink : C.paperDim}">Prévia</button>
      </div>
      ${mode === 'preview' ? `<div id="pdfBtnWrap" class="flex gap-2">${pdfButtonsHtml()}</div>` : ''}
    </div>
  </div>`;

  if (mode === 'preview') return toolbar + renderPreviewPage(p);

  const weeksHtml = p.weeks.map((w, i) => weekEditorHtml(p, w, i)).join('');
  return toolbar + `<div class="max-w-[760px] mx-auto py-6 px-5">
    ${renderAlunoLink(p)}
    ${renderHero(p)}
    ${renderVo2Calculator(p)}
    ${renderCalendarGenerator(p)}
    ${renderPeriodizationGenerator(p)}
    <div class="flex items-center justify-between mb-3 mt-6">
      <span class="pz-mono text-[12px] uppercase tracking-widest" style="color:${C.hivis}">Semanas</span>
      <button onclick="addWeek()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[12px] pz-display uppercase" style="background:${C.hivis};color:${C.ink}">＋ Nova semana</button>
    </div>
    ${weeksHtml}
    <div class="mt-6">${renderStrategyEditor(p)}</div>
    ${renderFooterSection(p)}
  </div>`;
}

/* ==================================================================== */
/*  DISPATCH PRINCIPAL                                                  */
/* ==================================================================== */
function syncBankDatalist() {
  const dl = document.getElementById('bank-codes-list'); if (!dl) return;
  dl.innerHTML = Object.values(bank).map((b) => `<option value="${esc(b.code)}"></option>`).join('');
}
function render() {
  const app = document.getElementById('app');
  if (!currentPlanId) {
    app.innerHTML = screen === 'roster' ? renderPlanList() : renderBankView();
  } else {
    const p = roster[currentPlanId];
    if (!p) { currentPlanId = null; render(); return; }
    app.innerHTML = renderPlanShell(p);
  }
  syncBankDatalist();
  updateSaveIndicator();
}

/* ==================================================================== */
/*  INIT                                                                 */
/* ==================================================================== */
async function init() {
  try {
    await Promise.all([loadRoster(), loadBank(), loadAlunos()]);
  } catch (e) { console.error(e); }
  document.getElementById('loadScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render();
  showToast('Carregado ✓');
}
init();

</script>
</body>
</html>
