<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PH Performance — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --acc:#c9f500;--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;
  --border:#1e1e1e;--border2:#2a2a2a;--text:#fff;--muted:#777;
  --green:#4ade80;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--purple:#a78bfa;
  --radius:14px;--radius-sm:10px;
  --sidebar:260px;--safe:env(safe-area-inset-bottom,0px)
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
input,textarea,select{font-family:'Inter',sans-serif;color:var(--text)}

.shell{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh;overflow:hidden}
@media(max-width:768px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .sidebar{display:none}
  .sidebar.mobile-open{display:flex;position:fixed;inset:0;z-index:200;width:85%;max-width:300px;background:#080808;overflow-y:auto;box-shadow:4px 0 32px rgba(0,0,0,.8)}
  .mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:199}
  .mobile-overlay.show{display:block}
  .mobile-nav{display:flex!important}
  .main-content{height:calc(100vh - 54px);overflow-y:auto}
}
@media(min-width:769px){.mobile-nav{display:none!important}}

/* SIDEBAR */
.sidebar{background:#080808;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:#1a1a1a}
.sb-brand{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.sb-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--acc);cursor:pointer}
.sb-sub{font-size:10px;color:#3a3a3a;margin-top:2px}
.sync-dot{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10px;color:#3a3a3a}
.sync-dot-circle{width:7px;height:7px;border-radius:50%;background:#3a3a3a;flex-shrink:0}
.sync-dot-circle.ok{background:var(--green)}
.sync-dot-circle.syncing{background:var(--yellow);animation:pulse .8s ease infinite}
.sync-dot-circle.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sb-section{padding:8px 8px 4px}
.sb-section-lbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#2a2a2a;padding:0 6px;margin-bottom:4px}
.sb-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;border-radius:var(--radius-sm);transition:all .12s;text-align:left}
.sb-btn:hover{background:var(--bg3);color:var(--text)}
.sb-btn.active{background:var(--bg2);color:var(--acc);border:1px solid var(--border)}
.sb-btn-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sb-alunos-head{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 4px}
.sb-add-btn{width:22px;height:22px;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.sb-add-btn:hover{border-color:var(--acc);color:var(--acc)}
.aluno-items{display:flex;flex-direction:column;gap:1px;padding:0 6px}
.aluno-item{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:10px;cursor:pointer;transition:background .12s;position:relative}
.aluno-item:hover{background:var(--bg3)}
.aluno-item.active{background:var(--bg2);border:1px solid var(--border2)}
.aluno-av{width:32px;height:32px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--acc);flex-shrink:0;overflow:hidden}
.aluno-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.aluno-info-sb{flex:1;min-width:0}
.aluno-nome-sb{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aluno-meta-sb{font-size:9px;color:#3a3a3a}
.aluno-acts{display:flex;gap:1px;opacity:0;transition:opacity .15s}
.aluno-item:hover .aluno-acts{opacity:1}
.aluno-act{background:none;border:none;cursor:pointer;color:#3a3a3a;font-size:10px;padding:3px;border-radius:4px;transition:color .15s}
.aluno-act:hover{color:var(--acc)}
.aluno-act.danger:hover{color:var(--red)}
.series-sb{display:flex;flex-direction:column;gap:1px;padding:0 6px}
.serie-sb-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;cursor:pointer;transition:background .12s}
.serie-sb-item:hover{background:var(--bg3)}
.serie-sb-item.active{background:var(--bg2);border:1px solid var(--border2)}
.serie-sb-badge{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;flex-shrink:0}
.serie-sb-name{flex:1;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.serie-sb-meta{font-size:9px;color:#3a3a3a}
.serie-sb-del{background:none;border:none;cursor:pointer;color:#1e1e1e;font-size:10px;padding:2px;opacity:0;transition:all .15s}
.serie-sb-item:hover .serie-sb-del{opacity:1}
.serie-sb-del:hover{color:var(--red)}
.sem-cards{padding:0 6px;display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.sem-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 9px}
.sem-card-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sem-badge{width:18px;height:18px;border-radius:50%;background:var(--acc);color:#111;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sem-name-inp{flex:1;background:transparent;border:none;color:var(--text);font-size:10px;font-weight:600;outline:none;font-family:'Inter',sans-serif}
.sem-del{background:none;border:none;cursor:pointer;color:#2a2a2a;font-size:10px}
.sem-del:hover{color:var(--red)}
.sem-fields{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.sem-field label{font-size:7px;color:#3a3a3a;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.sem-field input{width:100%;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;padding:4px 6px;color:var(--text);font-size:10px;outline:none;font-family:'Inter',sans-serif}
.sem-field input:focus{border-color:var(--acc)}
.btn-add-sem{display:flex;align-items:center;gap:4px;width:calc(100% - 12px);margin:0 6px 8px;padding:6px 9px;border:1px dashed var(--border);border-radius:8px;background:none;color:#3a3a3a;cursor:pointer;font-size:9px;font-family:'Inter',sans-serif;transition:all .15s}
.btn-add-sem:hover{border-color:var(--acc);color:var(--acc)}
.sb-bottom{padding:10px;margin-top:auto;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--border);flex-shrink:0}
.sb-action-btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:9px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:none;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.sb-action-btn:hover{border-color:var(--acc);color:var(--acc)}
.sb-action-btn.primary{background:var(--acc);border-color:var(--acc);color:#111}
.sb-action-btn.primary:hover{filter:brightness(1.1)}

/* MAIN */
.main-content{overflow-y:auto;background:var(--bg);height:100vh}
.main-content::-webkit-scrollbar{width:4px}
.main-content::-webkit-scrollbar-thumb{background:#1e1e1e;border-radius:2px}
.mobile-topbar{display:none;background:#080808;border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;gap:10px;position:sticky;top:0;z-index:100;flex-shrink:0}
@media(max-width:768px){.mobile-topbar{display:flex}}
.mob-menu-btn{width:36px;height:36px;border-radius:10px;background:var(--bg3);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:18px;flex-shrink:0}
.mob-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--acc);flex:1}
.mob-add{padding:7px 14px;background:var(--acc);border:none;border-radius:8px;color:#111;font-size:11px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
.mobile-nav{position:fixed;bottom:0;left:0;right:0;background:#080808;border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe);z-index:100}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;transition:color .15s}
.mob-nav-btn.active{color:var(--acc)}
.mob-nav-icon{font-size:20px}

/* CONTENT */
.content-area{padding:22px 24px 80px;max-width:900px}
@media(max-width:768px){.content-area{padding:14px 14px 100px}}

/* DASH */
.dash-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
@media(max-width:600px){.dash-kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;overflow:hidden}
.kpi-val{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;margin-bottom:2px}
.kpi-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#3a3a3a}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:4px}
.sec-title{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#3a3a3a;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.aluno-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:24px}
.aluno-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.aluno-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.aluno-card-accent{position:absolute;top:0;left:0;right:0;height:3px}
.aluno-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ac-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#111;flex-shrink:0;overflow:hidden}
.ac-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ac-name{font-size:13px;font-weight:800}
.ac-obj{font-size:10px;color:var(--muted);margin-top:1px}
.ac-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}
.ac-stat{background:var(--bg3);border-radius:7px;padding:6px;text-align:center}
.ac-stat-val{font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1}
.ac-stat-lbl{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3a3a3a;margin-top:1px}
.ac-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border)}
.ac-date{font-size:9px;color:#2a2a2a}
.ac-btns{display:flex;gap:4px}
.ac-btn{padding:3px 8px;font-size:9px;font-weight:700;border-radius:6px;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.ac-btn:hover{border-color:var(--acc);color:var(--acc)}
.ac-btn.danger:hover{border-color:var(--red);color:var(--red)}
.dash-add-card{border:1.5px dashed var(--border);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:140px}
.dash-add-card:hover{border-color:var(--acc)}

/* EDITOR */
.tabs-bar{display:flex;gap:3px;background:var(--bg3);border-radius:10px;padding:3px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:7px 12px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.04em;text-transform:uppercase;transition:all .15s;white-space:nowrap}
.tab-btn.active{background:var(--bg2);color:var(--acc);border:1px solid var(--border)}
.serie-head{margin-bottom:20px}
.serie-eyebrow{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.serie-eyebrow::after{content:'';flex:1;height:1px;background:var(--border)}
.serie-title-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.serie-letter-big{font-family:'Bebas Neue',sans-serif;font-size:56px;line-height:.9;flex-shrink:0}
.serie-name-inp{flex:1;font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--text);outline:none;transition:border-color .2s;min-width:0}
.serie-name-inp:focus{border-bottom-color:var(--acc)}
.serie-name-inp::placeholder{color:#1e1e1e}
.grupos-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.g-tag{padding:4px 10px;border-radius:20px;border:1.5px solid var(--border2);background:transparent;color:#444;cursor:pointer;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;transition:all .15s}
.g-tag:hover{border-color:var(--acc);color:var(--acc)}
.g-tag.on{background:var(--bg3)}
.g-tag[data-g="Peito"].on{color:#f472b6;border-color:#f472b6}
.g-tag[data-g="Costas"].on{color:#60a5fa;border-color:#60a5fa}
.g-tag[data-g="Pernas"].on{color:#f6ad55;border-color:#f6ad55}
.g-tag[data-g="Glúteos"].on{color:#fb7185;border-color:#fb7185}
.g-tag[data-g="Panturrilha"].on{color:#a78bfa;border-color:#a78bfa}
.g-tag[data-g="Ombros"].on{color:#60a5fa;border-color:#60a5fa}
.g-tag[data-g="Bíceps"].on{color:#34d399;border-color:#34d399}
.g-tag[data-g="Tríceps"].on{color:#fbbf24;border-color:#fbbf24}
.g-tag[data-g="Abdômen"].on{color:#f87171;border-color:#f87171}
.g-custom-inp{padding:4px 10px;border:1.5px dashed var(--border);border-radius:20px;background:transparent;color:#444;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;outline:none;width:100px;transition:all .15s;font-family:'Inter',sans-serif}
.g-custom-inp:focus{border-color:var(--acc);color:var(--text)}
.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;transition:border-color .2s}
.ex-card:hover{border-color:var(--border2)}
.ex-card.drag-over{border-color:var(--acc)!important;border-style:dashed}
.ex-card.dragging{opacity:.3}
.ex-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.drag-handle{display:flex;flex-direction:column;gap:3px;cursor:grab;padding:3px;opacity:.1;transition:opacity .15s;flex-shrink:0}
.drag-handle:active{cursor:grabbing}
.ex-card:hover .drag-handle{opacity:.4}
.drag-handle span{display:block;width:12px;height:2px;background:var(--text);border-radius:1px}
.ex-num-ed{width:26px;height:26px;border-radius:50%;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#111}
.ex-name-inp{flex:1;font-size:14px;font-weight:700;border:none;border-bottom:1.5px solid transparent;background:transparent;color:var(--text);outline:none;transition:border-color .2s;min-width:0}
.ex-name-inp::placeholder{color:#1e1e1e;font-weight:400}
.ex-name-inp:focus{border-bottom-color:var(--acc)}
.ex-del{background:none;border:none;cursor:pointer;color:#1e1e1e;font-size:13px;padding:3px;border-radius:5px;transition:all .15s}
.ex-del:hover{color:var(--red)}
.ex-params{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.ex-param{background:var(--bg3);border-radius:8px;padding:8px 10px}
.ex-param label{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.ex-param input{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;font-weight:700;outline:none;font-family:'Bebas Neue',sans-serif;letter-spacing:.5px}
.ex-param input::placeholder{color:#1e1e1e;font-weight:400;font-family:'Inter',sans-serif;font-size:11px}
.ex-obs-inp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-size:12px;resize:none;outline:none;transition:border-color .2s;margin-bottom:8px;font-family:'Inter',sans-serif}
.ex-obs-inp:focus{border-color:var(--border2)}
.ex-obs-inp::placeholder{color:#1e1e1e}
.ex-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border)}
.ex-media-inp{flex:1;min-width:120px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:5px 9px;color:var(--text);font-size:11px;outline:none;font-family:'Inter',sans-serif}
.ex-media-inp:focus{border-color:var(--border2)}
.ex-media-inp::placeholder{color:#1e1e1e}
.ex-media-add{padding:5px 10px;font-size:10px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);cursor:pointer;font-weight:700;transition:all .15s;white-space:nowrap;font-family:'Inter',sans-serif}
.ex-media-add:hover{background:var(--acc);color:#111;border-color:var(--acc)}
.thumb-wrap{position:relative}
.thumb-wrap img{width:48px;height:48px;object-fit:cover;border-radius:7px;border:1px solid var(--border);display:block}
.thumb-yt,.thumb-link{width:48px;height:48px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;justify-content:center;text-decoration:none}
.thumb-rm{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;font-size:7px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tecnica-sel{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:5px 8px;color:var(--muted);font-size:11px;font-weight:700;outline:none;font-family:'Inter',sans-serif;transition:all .15s}
.tecnica-sel:focus{border-color:var(--acc)}
.btn-add-ex{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:12px;border:1.5px dashed var(--border);border-radius:var(--radius);background:transparent;color:#333;cursor:pointer;font-size:11px;font-family:'Inter',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;transition:all .2s;margin-bottom:18px}
.btn-add-ex:hover{border-color:var(--acc);color:var(--acc)}

/* MuscleWiki */
.mw-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px}
.mw-search-row{display:flex;gap:6px;margin-bottom:8px}
.mw-inp{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-size:12px;outline:none;font-family:'Inter',sans-serif}
.mw-inp:focus{border-color:var(--acc)}
.mw-inp::placeholder{color:#1e1e1e}
.mw-search-btn{padding:7px 12px;background:var(--acc);border:none;border-radius:8px;color:#111;font-size:11px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif}
.mw-filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.mw-filter{padding:3px 8px;border-radius:20px;border:1px solid var(--border);background:transparent;color:#444;font-size:9px;font-weight:700;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.mw-filter:hover{border-color:var(--acc);color:var(--acc)}
.mw-filter.on{background:var(--acc);border-color:var(--acc);color:#111}
.mw-results{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.mw-result{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:9px}
.mw-result-name{font-size:12px;font-weight:700}

<script>
// ═══════════════════════════════════════════════════
//  SUPABASE CONFIG
// ═══════════════════════════════════════════════════
const SB_URL='https://fdojstrsiojbcoiumobv.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkb2pzdHJzaW9qYmNvaXVtb2J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDk3NjYsImV4cCI6MjA5NjU4NTc2Nn0.uDymw4Dsj40RH46dXxVLn6CjutJaruADrUFriQmqVbM';
const SB_HDR={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'};

// Mostra erro PERSISTENTE na tela (não some sozinho) — essencial pra debugar
function showErrorBanner(msg){
  const b=document.getElementById('errorBanner');
  const t=document.getElementById('errorBannerText');
  t.innerHTML=msg;
  b.classList.add('show');
  console.error('[ERRO SUPABASE]',msg);
}
function clearErrorBanner(){
  document.getElementById('errorBanner').classList.remove('show');
}

// sbFetch genérico que SEMPRE retorna {ok, data, error}
async function sbFetch(method,t,q,body){
  try{
    const url=SB_URL+'/rest/v1/'+t+(q?'?'+q:'');
    const opts={method,headers:SB_HDR};
    if(body!==undefined)opts.body=JSON.stringify(body);
    const r=await fetch(url,opts);
    const txt=await r.text();
    let data=null;
    try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
    if(!r.ok){
      return{ok:false,data:null,error:`[${r.status}] ${t}: ${typeof data==='string'?data:(data?.message||JSON.stringify(data))}`};
    }
    return{ok:true,data,error:null};
  }catch(e){
    return{ok:false,data:null,error:`Falha de rede em ${t}: ${e.message}`};
  }
}
async function sbGet(t,q=''){
  const r=await sbFetch('GET',t,q);
  if(!r.ok){showErrorBanner('Erro ao <strong>carregar</strong> dados de <strong>'+t+'</strong>: '+r.error);return[];}
  return r.data||[];
}
// UPSERT de UM registro (ou array pequeno) — usa merge-duplicates, não apaga nada antes
async function sbUpsert(t,data){
  const h={...SB_HDR,'Prefer':'resolution=merge-duplicates,return=representation'};
  const b=Array.isArray(data)?data:[data];
  try{
    const r=await fetch(SB_URL+'/rest/v1/'+t,{method:'POST',headers:h,body:JSON.stringify(b)});
    const txt=await r.text();
    let parsed=null;try{parsed=txt?JSON.parse(txt):null}catch(e){parsed=txt}
    if(!r.ok){
      const msg=`Erro ao SALVAR em "${t}": [${r.status}] ${typeof parsed==='string'?parsed:(parsed?.message||JSON.stringify(parsed))}`;
      showErrorBanner(msg+'<br><span style="color:#999;font-size:10px">Dica: verifique se a tabela e as colunas existem no Supabase exatamente como o app espera.</span>');
      return null;
    }
    return parsed;
  }catch(e){
    showErrorBanner('Falha de rede ao salvar em <strong>'+t+'</strong>: '+e.message);
    return null;
  }
}
async function sbDelete(t,id){
  const r=await sbFetch('DELETE',t,'id=eq.'+encodeURIComponent(id));
  if(!r.ok)showErrorBanner('Erro ao remover de <strong>'+t+'</strong>: '+r.error);
  return r.ok;
}
async function sbDeleteWhere(t,col,val){
  const r=await sbFetch('DELETE',t,col+'=eq.'+encodeURIComponent(val));
  if(!r.ok)showErrorBanner('Erro ao remover de <strong>'+t+'</strong>: '+r.error);
  return r.ok;
}
function setSync(s){
  const dot=document.getElementById('syncDot');const lbl=document.getElementById('syncLabel');
  const map={ok:['ok','✓ Sincronizado'],syncing:['syncing','Salvando...'],error:['error','⚠ Erro ao salvar']};
  const[cls,txt]=map[s]||map.ok;
  dot.className='sync-dot-circle '+cls;lbl.textContent=txt;
}

// ═══════════════════════════════════════════════════
//  DATABASE LOCAL + SUPABASE SYNC
//  LÓGICA NOVA:
//  - Cada exercício/série/aluno é salvo IMEDIATAMENTE e
//    INDIVIDUALMENTE no Supabase via UPSERT (sem apagar nada antes).
//  - Exclusão remove só o item específico (DELETE by id).
//  - localStorage é só um cache para abrir mais rápido;
//    o Supabase é sempre a fonte da verdade ao carregar.
//  - Erros aparecem num banner fixo no topo da tela.
// ═══════════════════════════════════════════════════
const DBKEY='ph_db5';
const CORES=['#c9f500','#63b3ed','#f6ad55','#f472b6','#a78bfa','#34d399','#fb7185','#fbbf24'];
const GRUPOS=['Peito','Costas','Pernas','Glúteos','Panturrilha','Ombros','Bíceps','Tríceps','Abdômen'];
const LETRAS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const GCOR={'Peito':'#f472b6','Costas':'#60a5fa','Pernas':'#f6ad55','Glúteos':'#fb7185','Panturrilha':'#a78bfa','Ombros':'#60a5fa','Bíceps':'#34d399','Tríceps':'#fbbf24','Abdômen':'#f87171'};

let db={consultoria:'PH PERFORMANCE',alunos:[]};
let alunoAtivo=null,serieAtiva=null,dragSrc=null,mwFiltro={};

function saveDB(){
  localStorage.setItem(DBKEY,JSON.stringify(db));
}
function loadDB(){
  try{const s=localStorage.getItem(DBKEY);if(s){const d=JSON.parse(s);db=d;}}catch(e){}
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ── Salva o registro do ALUNO (dados gerais, sem mexer em séries/exercícios) ──
async function syncAlunoMeta(a){
  if(!a)return false;
  setSync('syncing');
  const res=await sbUpsert('alunos',{
    id:a.id,nome:a.nome,objetivo:a.objetivo||null,nivel:a.nivel||null,
    dias:a.dias||null,periodo:a.periodo||null,obs:a.obs||null,foto:a.foto||null,
    financeiro:a.financeiro||null,anamnese:a.anamnese||null,
    proxima_avaliacao:a.proximaAvaliacao||null,proxima_troca:a.proximaTroca||null,
    updated_at:new Date().toISOString()
  });
  if(res){clearErrorBanner();setSync('ok');return true;}
  setSync('error');return false;
}

// ── Salva UMA semana (upsert pontual) ──
async function syncSemanas(a){
  if(!a)return false;
  setSync('syncing');
  // apaga só as que não existem mais é arriscado; em vez disso, regravamos
  // as semanas atuais (lista pequena, poucas linhas, risco baixo) e
  // removemos sobras por índice se a lista encolheu.
  const ok=await sbUpsert('semanas',(a.semanas||[]).map((s,i)=>({
    id:a.id+'_sem_'+i,aluno_id:a.id,ordem:i,
    nome:s.nome||'',reps:s.reps||'',descanso:s.descanso||''
  })));
  if(ok){clearErrorBanner();setSync('ok');return true;}
  setSync('error');return false;
}
// Remove semanas extras do Supabase quando o personal apaga uma semana
async function limparSemanasExtras(aId,totalAtual){
  // tenta remover índices acima do total atual (até 30 pra segurança)
  for(let i=totalAtual;i<totalAtual+10;i++){
    await sbDelete('semanas',aId+'_sem_'+i);
  }
}

// ── Salva UMA série (upsert pontual, não mexe em outras séries) ──
async function syncSerie(aId,serie,ordem){
  setSync('syncing');
  const res=await sbUpsert('series',{
    id:serie.id,aluno_id:aId,letra:serie.letra,
    nome:serie.nome||'',grupos:serie.grupos||[],ordem
  });
  if(res){clearErrorBanner();setSync('ok');return true;}
  setSync('error');return false;
}
async function deletarSerieSupabase(serieId){
  // apaga exercícios da série primeiro, depois a série
  await sbDeleteWhere('exercicios','serie_id',serieId);
  await sbDelete('series',serieId);
}

// ── Salva UM exercício (upsert pontual, não mexe em outros exercícios) ──
async function syncExercicio(aId,serieId,ex,ordem){
  setSync('syncing');
  const res=await sbUpsert('exercicios',{
    id:ex.id,serie_id:serieId,aluno_id:aId,
    nome:ex.nome||'',series_num:ex.series||'',reps:ex.reps||'',
    descanso:ex.descanso||'',obs:ex.obs||'',
    medias:ex.medias||[],tecnica:ex.tecnica||'',ordem
  });
  if(res){clearErrorBanner();setSync('ok');return true;}
  setSync('error');return false;
}
async function deletarExercicioSupabase(exId){
  await sbDelete('exercicios',exId);
}

// ── Sync completo (usado em criar aluno, duplicar ficha, etc) ──
// Faz upsert de tudo SEM apagar nada antes — seguro mesmo se algo falhar no meio.
async function syncAluno(a){
  if(!a)return false;
  setSync('syncing');
  let okGeral=true;
  const metaOk=await syncAlunoMeta(a);
  if(!metaOk)okGeral=false;
  if(a.semanas?.length){
    const semOk=await syncSemanas(a);
    if(!semOk)okGeral=false;
  }
  for(let i=0;i<(a.series||[]).length;i++){
    const serie=a.series[i];
    const sOk=await syncSerie(a.id,serie,i);
    if(!sOk)okGeral=false;
    for(let j=0;j<(serie.exercicios||[]).length;j++){
      const exOk=await syncExercicio(a.id,serie.id,serie.exercicios[j],j);
      if(!exOk)okGeral=false;
    }
  }
  setSync(okGeral?'ok':'error');
  return okGeral;
}

// ── Carrega TUDO do Supabase → db.alunos (fonte da verdade) ──
async function carregarSupabase(){
  setSync('syncing');
  const alunos=await sbGet('alunos','order=created_at.asc');
  if(!alunos.length){
    setSync('ok');
    return db.alunos.length>0; // mantém cache local se Supabase vier vazio mas já tínhamos dados
  }
  const[sems,series,exs]=await Promise.all([
    sbGet('semanas','order=aluno_id,ordem'),
    sbGet('series','order=aluno_id,ordem'),
    sbGet('exercicios','order=serie_id,ordem')
  ]);

  db.alunos=alunos.map(a=>{
    const aId=a.id;
    return{
      id:aId,nome:a.nome,objetivo:a.objetivo,nivel:a.nivel,
      dias:a.dias,periodo:a.periodo,obs:a.obs,foto:a.foto,
      financeiro:a.financeiro||{},anamnese:a.anamnese||{},
      proximaAvaliacao:a.proxima_avaliacao,proximaTroca:a.proxima_troca,
      updatedAt:a.updated_at,
      semanas:sems.filter(s=>s.aluno_id===aId)
        .sort((x,y)=>x.ordem-y.ordem)
        .map(s=>({nome:s.nome,reps:s.reps,descanso:s.descanso})),
      series:series.filter(s=>s.aluno_id===aId)
        .sort((x,y)=>x.ordem-y.ordem)
        .map(se=>({
          id:se.id,letra:se.letra,nome:se.nome,grupos:se.grupos||[],
          exercicios:exs.filter(ex=>ex.serie_id===se.id)
            .sort((x,y)=>x.ordem-y.ordem)
            .map(ex=>({
              id:ex.id,nome:ex.nome,series:ex.series_num,
              reps:ex.reps,descanso:ex.descanso,obs:ex.obs,
              medias:ex.medias||[],tecnica:ex.tecnica||''
            }))
        }))
    };
  });
  saveDB();
  clearErrorBanner();
  setSync('ok');
  return true;
}

<script>
// ═══════════════════════════════════════════════════
//  MOBILE
// ═══════════════════════════════════════════════════
function toggleSidebar(){

// ═══════════════════════════════════════════════════
//  NAV
// ═══════════════════════════════════════════════════
function setNav(id){

    const el=document.getElementById(n);

  });
}
function irDash(){setNav('navDash');setMobNav('dash');alunoAtivo=null;renderAlunoList();document.getElementById('sidebarExtra').style.display='none';renderDash();closeSidebar();}
function irFinanceiro(){setNav('navFin');setMobNav('fin');alunoAtivo=null;renderAlunoList();document.getElementById('sidebarExtra').style.display='none';renderFinanceiro();closeSidebar();}
function irAgenda(){setNav('navAgenda');setMobNav('agenda');alunoAtivo=null;renderAlunoList();document.getElementById('sidebarExtra').style.display='none';renderAgenda();closeSidebar();}

// ═══════════════════════════════════════════════════
//  MODAL NOVO ALUNO
// ═══════════════════════════════════════════════════
function abrirModal(){
  ['mNome','mObj','mNivel','mDias','mPeriodo','mObs'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});
  document.getElementById('modalNovoAluno').classList.add('open');
  setTimeout(()=>document.getElementById('mNome').focus(),50);
}
function fecharModal(){document.getElementById('modalNovoAluno').classList.remove('open')}
document.getElementById('modalNovoAluno').addEventListener('click',e=>{if(e.target===e.currentTarget)fecharModal()});

async function criarAluno(){
  const nome=document.getElementById('mNome').value.trim();
  if(!nome){document.getElementById('mNome').focus();return;}
  const a={
    id:'a'+Date.now(),nome,
    objetivo:document.getElementById('mObj').value.trim(),
    nivel:document.getElementById('mNivel').value.trim(),
    dias:document.getElementById('mDias').value.trim(),
    periodo:document.getElementById('mPeriodo').value.trim(),
    obs:document.getElementById('mObs').value.trim(),
    semanas:[
      {nome:'Resistência',reps:'15–20',descanso:'30s'},
      {nome:'Hipertrofia',reps:'10–12',descanso:'60s'},
      {nome:'Força',reps:'4–6',descanso:'2min'},
      {nome:'Deload',reps:'12–15',descanso:'45s'}
    ],
    series:['A','B','C'].map(l=>({
      id:'s'+Date.now()+l+Math.random().toString(36).slice(2),
      letra:l,nome:'',grupos:[],exercicios:[]
    }))
  };
  db.alunos.push(a);
  saveDB();
  fecharModal();
  renderAlunoList();
  await syncAluno(a);
  selecionarAluno(a.id);
  showToast('✅ Aluno criado!');
}

function deletarAluno(id,e){
  e.stopPropagation();
  const a=db.alunos.find(x=>x.id===id);
  if(!confirm('Remover '+(a?.nome||'aluno')+'? Esta ação não pode ser desfeita.'))return;
  db.alunos=db.alunos.filter(x=>x.id!==id);
  saveDB();
  sbDelete('alunos',id);
  if(alunoAtivo?.id===id){alunoAtivo=null;renderEmpty();}
  renderAlunoList();
  showToast('🗑 Aluno removido');
}

// ═══════════════════════════════════════════════════
//  ALUNO LIST SIDEBAR
// ═══════════════════════════════════════════════════
function renderAlunoList(){
  const el=document.getElementById('alunoList');
  if(!db.alunos.length){
    el.innerHTML='<div style="padding:8px 12px;font-size:10px;color:#2a2a2a">Nenhum aluno ainda</div>';
    return;
  }
  el.innerHTML=db.alunos.map(a=>{
    const ini=a.nome.trim().split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
    const fotoH=a.foto?`<img src="${a.foto}" alt=""/>`:`${ini}`;
    const at=alunoAtivo?.id===a.id;
    const tot=a.series.reduce((s,sr)=>s+sr.exercicios.length,0);
    const fin=a.financeiro||{};
    const inad=fin.status==='atrasado';
    return`<div class="aluno-item${at?' active':''}" onclick="selecionarAluno('${a.id}');closeSidebar()">
      <div class="aluno-av">${fotoH}</div>
      <div class="aluno-info-sb">
        <div class="aluno-nome-sb">${esc(a.nome)}${inad?'<span style="margin-left:3px;font-size:8px;color:var(--red)">$</span>':''}</div>
        <div class="aluno-meta-sb">${a.series.length} séries · ${tot} ex.</div>
      </div>
      <div class="aluno-acts">
        <button class="aluno-act" onclick="abrirDupModal('${a.id}');event.stopPropagation()" title="Duplicar">⎘</button>
        <button class="aluno-act danger" onclick="deletarAluno('${a.id}',event)" title="Remover">✕</button>
      </div>
    </div>`;
  }).join('');
}

function selecionarAluno(id){
  alunoAtivo=db.alunos.find(x=>x.id===id);
  if(!alunoAtivo)return;
  document.getElementById('sidebarExtra').style.display='block';
  renderAlunoList();renderSemanas();renderSeriesNav();
  const firstSerie=alunoAtivo.series[0];
  if(firstSerie){serieAtiva=firstSerie.id;renderSerieEditor(firstSerie.id);}
  else renderEmpty();
}

function renderEmpty(){
  document.getElementById('sidebarExtra').style.display='none';
  document.getElementById('mainContent').innerHTML=`<div class="content-area"><div class="empty-main"><div class="empty-logo">${esc(db.consultoria)}</div><p class="empty-sub">Selecione um aluno ou clique em <strong>＋</strong> para criar.</p></div></div>`;
}

// ═══════════════════════════════════════════════════
//  SEMANAS
// ═══════════════════════════════════════════════════
function addSemana(){
  if(!alunoAtivo)return;
  alunoAtivo.semanas.push({nome:'',reps:'',descanso:''});
  saveDB();renderSemanas();
  syncSemanas(alunoAtivo);
}
function delSemana(i){
  if(!alunoAtivo)return;
  alunoAtivo.semanas.splice(i,1);
  saveDB();renderSemanas();
  const total=alunoAtivo.semanas.length;
  syncSemanas(alunoAtivo).then(()=>limparSemanasExtras(alunoAtivo.id,total));
}
let semanaSaveTimer=null;
function semanaInputChange(i,campo,val){
  if(!alunoAtivo)return;
  alunoAtivo.semanas[i][campo]=val;
  saveDB();
  clearTimeout(semanaSaveTimer);
  semanaSaveTimer=setTimeout(()=>syncSemanas(alunoAtivo),700);
}
function renderSemanas(){
  if(!alunoAtivo)return;
  document.getElementById('semList').innerHTML=alunoAtivo.semanas.map((s,i)=>`
    <div class="sem-card">
      <div class="sem-card-top">
        <div class="sem-badge">${i+1}</div>
        <input class="sem-name-inp" type="text" placeholder="Nome" value="${esc(s.nome)}"
          oninput="semanaInputChange(${i},'nome',this.value)"/>
        <button class="sem-del" onclick="delSemana(${i})">✕</button>
      </div>
      <div class="sem-fields">
        <div class="sem-field"><label>Reps</label><input type="text" placeholder="10–12" value="${esc(s.reps)}"
          oninput="semanaInputChange(${i},'reps',this.value)"/></div>
        <div class="sem-field"><label>Descanso</label><input type="text" placeholder="60s" value="${esc(s.descanso)}"
          oninput="semanaInputChange(${i},'descanso',this.value)"/></div>
      </div>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════
//  SÉRIES
// ═══════════════════════════════════════════════════
function addSerie(){
  if(!alunoAtivo)return;
  const i=alunoAtivo.series.length;
  const s={id:'s'+Date.now()+Math.random().toString(36).slice(2),letra:LETRAS[i]||('S'+(i+1)),nome:'',grupos:[],exercicios:[]};
  alunoAtivo.series.push(s);
  saveDB();
  serieAtiva=s.id;
  renderSeriesNav();renderSerieEditor(s.id);
  syncSerie(alunoAtivo.id,s,i);
}
async function delSerie(sid,e){
  e.stopPropagation();
  if(!alunoAtivo||alunoAtivo.series.length<=1){showToast('⚠️ Precisa ter ao menos 1 série');return;}
  if(!confirm('Remover esta série e todos os seus exercícios?'))return;
  alunoAtivo.series=alunoAtivo.series.filter(s=>s.id!==sid);
  alunoAtivo.series.forEach((s,i)=>s.letra=LETRAS[i]||('S'+(i+1)));
  saveDB();
  serieAtiva=alunoAtivo.series[0].id;
  renderSeriesNav();renderSerieEditor(serieAtiva);
  await deletarSerieSupabase(sid);
  // re-sincroniza letras das séries restantes
  for(let i=0;i<alunoAtivo.series.length;i++){
    syncSerie(alunoAtivo.id,alunoAtivo.series[i],i);
  }
}
function getSerie(sid){return alunoAtivo?.series.find(x=>x.id===sid)}
function ativarSerie(sid){
  serieAtiva=sid;
  renderSeriesNav();renderSerieEditor(sid);
}
function renderSeriesNav(){
  if(!alunoAtivo)return;
  document.getElementById('seriesNav').innerHTML=alunoAtivo.series.map((s,i)=>{
    const cor=CORES[i%CORES.length];const at=serieAtiva===s.id;
    return`<div class="serie-sb-item${at?' active':''}" onclick="ativarSerie('${s.id}')">
      <div class="serie-sb-badge" style="background:${cor};color:#111">${s.letra}</div>
      <div style="flex:1;min-width:0">
        <div class="serie-sb-name">${s.nome||'Série '+s.letra}</div>
        <div class="serie-sb-meta">${s.exercicios.length} ex.</div>
      </div>
      <button class="serie-sb-del" onclick="delSerie('${s.id}',event)">✕</button>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════
//  EDITOR DE SÉRIE
// ═══════════════════════════════════════════════════
function renderSerieEditor(sid){
  if(!alunoAtivo)return;
  const s=getSerie(sid);if(!s)return;
  serieAtiva=sid;

  const cor=CORES[si%CORES.length];

    <div class="mw-wrap">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">💪 Banco de Exercícios</div>
        <div style="display:flex;gap:6px">
          <button onclick="verAnamnese()" style="padding:5px 10px;font-size:10px;font-weight:700;border-radius:7px;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif" onmouseover="this.style.color='var(--acc)'" onmouseout="this.style.color='var(--muted)'">📋 Anamnese</button>
          <button onclick="verProgresso()" style="padding:5px 10px;font-size:10px;font-weight:700;border-radius:7px;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif" onmouseover="this.style.color='var(--green)'" onmouseout="this.style.color='var(--muted)'">📊 Progresso</button>
          <button onclick="salvarAgora()" style="padding:5px 10px;font-size:10px;font-weight:700;border-radius:7px;border:1px solid var(--acc)44;background:var(--acc)15;color:var(--acc);cursor:pointer;font-family:'Inter',sans-serif">💾 Salvar tudo agora</button>

      <div class="mw-cad-form" id="mwCF_${sid}">
        <div class="mw-cad-row">
          <div class="mw-cad-field"><label>Nome</label><input id="mwCN_${sid}" type="text" placeholder="Ex: Hack Squat"/></div>
          <div class="mw-cad-field"><label>Grupamento</label><select id="mwCM_${sid}">${GRUPOS.map(g=>`<option>${g}</option>`).join('')}<option>Outro</option></select></div>
        </div>
        <div class="mw-cad-field"><label>Link (opcional)</label><input id="mwCU_${sid}" type="text" placeholder="https://"/></div>
        <button class="mw-cad-save" onclick="mwCadastrar('${sid}')">Salvar no banco</button>
      </div>
    </div>
  </div>`;
  initDrag(document.getElementById('exList_'+sid),sid);
  buscarMW(sid);
}

// Indicador visual: "salvando..." → "salvo ✓" / "erro ✕"
function showSaveStatus(elId,state){
  const el=document.getElementById(elId);
  if(!el)return;
  const map={saving:['saving','💾 salvando...'],saved:['saved','✓ salvo'],error:['error','✕ erro ao salvar']};
  const[cls,txt]=map[state]||['',''];
  el.className='save-status show '+cls;
  el.textContent=txt;
  if(state==='saved'){
    setTimeout(()=>{if(el)el.classList.remove('show')},1500);
  }
}

let serieNomeTimer=null;
function serieNomeChange(sid,val){
  const s=getSerie(sid);if(!s)return;
  s.nome=val;saveDB();renderSeriesNav();
  const statusId='serieSaveStatus_'+sid;
  showSaveStatus(statusId,'saving');
  clearTimeout(serieNomeTimer);
  serieNomeTimer=setTimeout(async()=>{
    const si=alunoAtivo.series.indexOf(s);
    const ok=await syncSerie(alunoAtivo.id,s,si);
    showSaveStatus(statusId,ok?'saved':'error');
  },600);
}

async function salvarAgora(){
  if(!alunoAtivo)return;
  showToast('💾 Salvando tudo...');
  const ok=await syncAluno(alunoAtivo);
  showToast(ok?'✅ Treino salvo no Supabase!':'⚠️ Houve erro — veja o aviso no topo');
}

function buildExCard(sid,ex,num,cor){
  const tecOpts=['Nenhuma','Bi-set','Tri-set','Drop-set','Super-set','Composto','Progressivo','Pirâmide Crescente','Pirâmide Decrescente','Rest-pause','Isometria','Excêntrico'];
  const yi=`<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/></svg>`;
  const thumbs=(ex.medias||[]).map(m=>{
    const rm=`<button class="thumb-rm" onclick="delMedia('${sid}','${ex.id}','${m.id}')">✕</button>`;
    if(m.type==='yt')return`<div class="thumb-wrap" id="md_${m.id}"><a href="${m.url}" target="_blank" class="thumb-yt">${yi}</a>${rm}</div>`;
    if(m.type==='img')return`<div class="thumb-wrap" id="md_${m.id}"><img src="${m.url}" alt=""/>${rm}</div>`;
    return`<div class="thumb-wrap" id="md_${m.id}"><a href="${m.url}" target="_blank" class="thumb-link" style="font-size:16px;color:#555">↗</a>${rm}</div>`;
  }).join('');
  const tecAtual=ex.tecnica||'Nenhuma';
  return`<div class="ex-card" id="excard_${ex.id}" draggable="true" data-exid="${ex.id}" data-sid="${sid}">
    <div class="ex-top">
      <div class="drag-handle"><span></span><span></span><span></span></div>
      <div class="ex-num-ed" style="background:${cor}">${num}</div>
      <input class="ex-name-inp" type="text" placeholder="Nome do exercício" value="${esc(ex.nome)}"
        oninput="updEx('${sid}','${ex.id}','nome',this.value)"/>
      <span class="save-status" id="exSaveStatus_${ex.id}"></span>
      <button class="ex-del" onclick="delEx('${sid}','${ex.id}')">✕</button>
    </div>
    <div class="ex-params">
      <div class="ex-param"><label>Séries</label><input type="text" placeholder="4" value="${esc(ex.series)}"
        oninput="updEx('${sid}','${ex.id}','series',this.value)"/></div>
      <div class="ex-param"><label>Repetições</label><input type="text" placeholder="10–12" value="${esc(ex.reps)}"
        oninput="updEx('${sid}','${ex.id}','reps',this.value)"/></div>
      <div class="ex-param"><label>Descanso</label><input type="text" placeholder="60s" value="${esc(ex.descanso)}"
        oninput="updEx('${sid}','${ex.id}','descanso',this.value)"/></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <select class="tecnica-sel" onchange="updEx('${sid}','${ex.id}','tecnica',this.value)" style="color:${tecAtual!=='Nenhuma'?'var(--acc)':'var(--muted)'}">
        ${tecOpts.map(t=>`<option value="${t}"${t===tecAtual?' selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <textarea class="ex-obs-inp" rows="2" placeholder="Observações: carga, cadência, forma..."
      oninput="updEx('${sid}','${ex.id}','obs',this.value)">${esc(ex.obs)}</textarea>
    <div class="ex-footer">
      <input class="ex-media-inp" id="mi_${ex.id}" type="text" placeholder="URL YouTube / imagem / link"
        onkeydown="if(event.key==='Enter')addMedia('${sid}','${ex.id}')"/>
      <button class="ex-media-add" onclick="addMedia('${sid}','${ex.id}')">+ Mídia</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px" id="mt_${ex.id}">${thumbs}</div>
  </div>`;
}

function toggleGrupo(sid,g,el){
  const s=getSerie(sid);if(!s)return;
  if(s.grupos.includes(g))s.grupos=s.grupos.filter(x=>x!==g);else s.grupos.push(g);
  el.classList.toggle('on');
  saveDB();
  const si=alunoAtivo.series.indexOf(s);
  syncSerie(alunoAtivo.id,s,si);
}
function addGrupoCustom(sid,inp){
  const v=inp.value.trim();if(!v)return;
  const s=getSerie(sid);if(!s)return;
  if(!s.grupos.includes(v))s.grupos.push(v);
  saveDB();
  const si=alunoAtivo.series.indexOf(s);
  syncSerie(alunoAtivo.id,s,si);
  const row=document.getElementById('gRow_'+sid);
  const sp=document.createElement('span');
  sp.className='g-tag on';sp.dataset.g=v;sp.textContent='✦ '+v;
  sp.onclick=function(){toggleGrupo(sid,v,this)};
  row.insertBefore(sp,inp);inp.value='';
}
function addEx(sid){
  const s=getSerie(sid);if(!s)return;
  const ex={id:'ex'+Date.now()+Math.random().toString(36).slice(2),nome:'',series:'',reps:'',descanso:'',obs:'',medias:[],tecnica:'Nenhuma'};
  s.exercicios.push(ex);
  saveDB();
  const si=alunoAtivo.series.indexOf(s);
  const cor=CORES[si%CORES.length];
  const lista=document.getElementById('exList_'+sid);
  const d=document.createElement('div');
  d.innerHTML=buildExCard(sid,ex,s.exercicios.length,cor);
  lista.appendChild(d.firstElementChild);
  initDrag(lista,sid);
  lista.querySelector('#excard_'+ex.id+' .ex-name-inp').focus();
  renderSeriesNav();
  // Salva o exercício novo (vazio) imediatamente, garante que existe no Supabase
  const ordem=s.exercicios.length-1;
  showSaveStatus('exSaveStatus_'+ex.id,'saving');
  syncExercicio(alunoAtivo.id,sid,ex,ordem).then(ok=>showSaveStatus('exSaveStatus_'+ex.id,ok?'saved':'error'));
}
async function delEx(sid,eid){
  const s=getSerie(sid);if(!s)return;
  s.exercicios=s.exercicios.filter(e=>e.id!==eid);
  saveDB();
  document.getElementById('excard_'+eid)?.remove();
  document.querySelectorAll('#exList_'+sid+' .ex-card .ex-num-ed').forEach((n,i)=>n.textContent=i+1);
  renderSeriesNav();
  await deletarExercicioSupabase(eid);
}
const exSaveTimers={};
function updEx(sid,eid,c,v){
  const s=getSerie(sid);if(!s)return;
  const ex=s.exercicios.find(x=>x.id===eid);
  if(ex)ex[c]=v;
  saveDB();
  const statusId='exSaveStatus_'+eid;
  showSaveStatus(statusId,'saving');
  clearTimeout(exSaveTimers[eid]);
  exSaveTimers[eid]=setTimeout(async()=>{
    const ordem=s.exercicios.findIndex(x=>x.id===eid);
    const ok=await syncExercicio(alunoAtivo.id,sid,ex,ordem);
    showSaveStatus(statusId,ok?'saved':'error');
  },600);
}
function addMedia(sid,eid){
  const inp=document.getElementById('mi_'+eid);if(!inp)return;
  const url=inp.value.trim();if(!url)return;
  const s=getSerie(sid);if(!s)return;
  const ex=s.exercicios.find(x=>x.id===eid);if(!ex)return;
  const yt=url.match(/(?:youtu\.be\/|v=|\/embed\/)([A-Za-z0-9_-]{11})/);
  const img=/\.(jpg|jpeg|png|gif|webp)/i.test(url);
  const type=yt?'yt':img?'img':'link';
  const mid='m'+Date.now();
  ex.medias.push({id:mid,type,url});
  saveDB();inp.value='';
  const mt=document.getElementById('mt_'+eid);
  if(mt){
    const yi=`<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/></svg>`;
    const w=document.createElement('div');w.className='thumb-wrap';w.id='md_'+mid;
    if(type==='yt')w.innerHTML=`<a href="${url}" target="_blank" class="thumb-yt">${yi}</a>`;
    else if(type==='img')w.innerHTML=`<img src="${url}" alt=""/>`;
    else w.innerHTML=`<a href="${url}" target="_blank" class="thumb-link" style="font-size:16px;color:#555">↗</a>`;
    const rm=document.createElement('button');rm.className='thumb-rm';rm.textContent='✕';
    rm.onclick=()=>delMedia(sid,eid,mid);w.appendChild(rm);mt.appendChild(w);
  }
  const ordem=s.exercicios.findIndex(x=>x.id===eid);
  syncExercicio(alunoAtivo.id,sid,ex,ordem);
}
function delMedia(sid,eid,mid){
  const s=getSerie(sid);if(!s)return;
  const ex=s.exercicios.find(x=>x.id===eid);if(!ex)return;
  ex.medias=ex.medias.filter(m=>m.id!==mid);
  saveDB();
  document.getElementById('md_'+mid)?.remove();
  const ordem=s.exercicios.findIndex(x=>x.id===eid);
  syncExercicio(alunoAtivo.id,sid,ex,ordem);
}

function initDrag(lista,sid){
  lista.addEventListener('dragstart',e=>{
    const c=e.target.closest('.ex-card');if(!c)return;
    dragSrc=c.dataset.exid;c.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
  });
  lista.addEventListener('dragend',()=>document.querySelectorAll('.ex-card').forEach(c=>c.classList.remove('dragging','drag-over')));
  lista.addEventListener('dragover',e=>{
    e.preventDefault();
    const c=e.target.closest('.ex-card');
    document.querySelectorAll('.ex-card').forEach(x=>x.classList.remove('drag-over'));
    if(c&&c.dataset.exid!==dragSrc)c.classList.add('drag-over');
  });
  lista.addEventListener('drop',e=>{
    e.preventDefault();
    const tc=e.target.closest('.ex-card');
    if(!tc||!dragSrc||tc.dataset.exid===dragSrc)return;
    const s=getSerie(sid);if(!s)return;
    const fi=s.exercicios.findIndex(x=>x.id===dragSrc);
    const ti=s.exercicios.findIndex(x=>x.id===tc.dataset.exid);
    if(fi===-1||ti===-1)return;
    const[m]=s.exercicios.splice(fi,1);s.exercicios.splice(ti,0,m);
    saveDB();
    const si=alunoAtivo.series.indexOf(s);const cor=CORES[si%CORES.length];
    lista.innerHTML=s.exercicios.map((ex,ei)=>buildExCard(sid,ex,ei+1,cor)).join('');
    initDrag(lista,sid);
    // Re-sincroniza a ordem de todos os exercícios da série
    s.exercicios.forEach((ex,ei)=>syncExercicio(alunoAtivo.id,sid,ex,ei));
  });
}

// MuscleWiki
function getMWDB(){
  const custom=JSON.parse(localStorage.getItem('ph_exdb')||'[]');
  return[...MW_BUILTIN,...custom];
}
function setFiltro(sid,g,el){
  const row=document.getElementById('mwF_'+sid);
  row.querySelectorAll('.mw-filter').forEach(b=>b.classList.remove('on'));
  if(mwFiltro[sid]===g){mwFiltro[sid]='';}else{mwFiltro[sid]=g;el.classList.add('on');}
  buscarMW(sid);
}
function buscarMW(sid){
  const q=(document.getElementById('mwInp_'+sid)?.value||'').trim().toLowerCase();
  const fil=mwFiltro[sid]||'';
  const found=getMWDB().filter(e=>(!q||e.nome.toLowerCase().includes(q)||e.musculo.toLowerCase().includes(q))&&(!fil||e.musculo===fil)).slice(0,10);
  const el=document.getElementById('mwR_'+sid);if(!el)return;
  if(!found.length){el.innerHTML=`<div class="mw-empty">Nenhum resultado. <a href="https://musclewiki.com" target="_blank">Abrir MuscleWiki ↗</a></div>`;return;}
  el.innerHTML=found.map(e=>{
    const url=e.url||('https://musclewiki.com/pt-br/exercise/'+e.slug);
    const sn=e.nome.replace(/'/g,"\\'");const su=url.replace(/'/g,"\\'");
    const cor=GCOR[e.musculo]||'#c9f500';
    return`<div class="mw-result">
      <div><div class="mw-result-name">${esc(e.nome)}</div><div class="mw-result-muscle" style="color:${cor}">${e.musculo}</div></div>
      <div class="mw-result-btns">
        <button class="mw-add-btn" onclick="mwAdd('${sid}','${sn}','${su}')">＋</button>
        <a class="mw-view-btn" href="${url}" target="_blank">↗</a>
        ${e.custom?`<button class="mw-view-btn" onclick="delCustomEx('${e.id}','${sid}')">✕</button>`:''}
      </div>
    </div>`;
  }).join('');
}
function mwAdd(sid,nome,url){
  const s=getSerie(sid);if(!s)return;
  const ex={id:'ex'+Date.now()+Math.random().toString(36).slice(2),nome,series:'',reps:'',descanso:'',obs:'',medias:[{id:'m'+Date.now(),type:'link',url}],tecnica:'Nenhuma'};
  s.exercicios.push(ex);saveDB();
  const si=alunoAtivo.series.indexOf(s);const cor=CORES[si%CORES.length];
  const lista=document.getElementById('exList_'+sid);
  const d=document.createElement('div');d.innerHTML=buildExCard(sid,ex,s.exercicios.length,cor);
  lista.appendChild(d.firstElementChild);initDrag(lista,sid);
  renderSeriesNav();
  const inp=document.getElementById('mwInp_'+sid);if(inp)inp.value='';buscarMW(sid);
  showToast('✅ '+nome+' adicionado!');
  const ordem=s.exercicios.length-1;
  showSaveStatus('exSaveStatus_'+ex.id,'saving');
  syncExercicio(alunoAtivo.id,sid,ex,ordem).then(ok=>showSaveStatus('exSaveStatus_'+ex.id,ok?'saved':'error'));
}
function delCustomEx(id,sid){
  const arr=JSON.parse(localStorage.getItem('ph_exdb')||'[]').filter(e=>e.id!==id);
  localStorage.setItem('ph_exdb',JSON.stringify(arr));buscarMW(sid);
}
function toggleCad(sid){
  const f=document.getElementById('mwCF_'+sid);const b=document.getElementById('mwCT_'+sid);
  const op=f.style.display==='flex';
  f.style.display=op?'none':'flex';
  b.textContent=op?'＋ Cadastrar exercício personalizado':'✕ Fechar cadastro';
}
function mwCadastrar(sid){
  const n=(document.getElementById('mwCN_'+sid)?.value||'').trim();
  const m=document.getElementById('mwCM_'+sid)?.value||'';
  const u=(document.getElementById('mwCU_'+sid)?.value||'').trim();
  if(!n)return;
  const arr=JSON.parse(localStorage.getItem('ph_exdb')||'[]');
  arr.push({id:'cex'+Date.now(),nome:n,musculo:m,url:u||null,custom:true});
  localStorage.setItem('ph_exdb',JSON.stringify(arr));
  document.getElementById('mwCN_'+sid).value='';
  document.getElementById('mwCU_'+sid).value='';
  buscarMW(sid);toggleCad(sid);
  showToast('✅ Exercício cadastrado!');
}

function renderDash(){
  if(!db.alunos.length){
    document.getElementById('mainContent').innerHTML=`<div class="content-area"><div class="empty-main"><div class="empty-logo">${esc(db.consultoria)}</div><p class="empty-sub">Clique em ＋ para adicionar seu primeiro aluno.</p></div></div>`;
    return;
  }
  const hoje=new Date();
  const inadimplentes=db.alunos.filter(a=>a.financeiro?.status==='atrasado');
  const ativos=db.alunos.filter(a=>a.financeiro?.status!=='inativo');
  const mesAtual=hoje.getMonth();
  const anivMes=db.alunos.filter(a=>{
    if(!a.anamnese?.nasc)return false;
    const d=new Date(a.anamnese.nasc+'T00:00:00');
    return d.getMonth()===mesAtual;
  });
  const precisamReav=db.alunos.filter(a=>a.proximaAvaliacao&&new Date(a.proximaAvaliacao)<hoje);

  const cards=db.alunos.map((a,ai)=>{
    const cor=CORES[ai%CORES.length];
    const ini=a.nome.trim().split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
    const tot=a.series.reduce((s,sr)=>s+sr.exercicios.length,0);
    const upd=a.updatedAt?new Date(a.updatedAt).toLocaleDateString('pt-BR'):'—';
    const fin=a.financeiro||{};
    const statusCor=fin.status==='atrasado'?'var(--red)':fin.status==='pago'?'var(--green)':'#3a3a3a';
    const fotoH=a.foto?`<img src="${a.foto}" alt=""/>`:`${ini}`;
    const temAnamnese=Object.keys(a.anamnese||{}).length>2;
    return`<div class="aluno-card" onclick="selecionarAluno('${a.id}')">
      <div class="aluno-card-accent" style="background:${cor}"></div>
      <div class="aluno-card-head">
        <div class="ac-av" style="background:${cor}">${fotoH}</div>
        <div>
          <div class="ac-name">${esc(a.nome)}</div>
          <div class="ac-obj">${esc(a.objetivo||'—')}</div>
          <div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">
            ${fin.status?`<span style="font-size:8px;font-weight:700;padding:2px 6px;border-radius:10px;background:${statusCor}22;color:${statusCor}">${fin.status==='pago'?'✓ Pago':fin.status==='atrasado'?'⚠ Atrasado':fin.status==='vence'?'⏰ Vence':'—'}</span>`:''}
            ${temAnamnese?`<span style="font-size:8px;font-weight:700;padding:2px 6px;border-radius:10px;background:#4ade8022;color:#4ade80">📋 Anamnese</span>`:'<span style="font-size:8px;font-weight:700;padding:2px 6px;border-radius:10px;background:#f8717122;color:#f87171">📋 Sem anamnese</span>'}
          </div>
        </div>
      </div>
      <div class="ac-stats">
        <div class="ac-stat"><div class="ac-stat-val" style="color:${cor}">${a.series.length}</div><div class="ac-stat-lbl">Séries</div></div>
        <div class="ac-stat"><div class="ac-stat-val">${tot}</div><div class="ac-stat-lbl">Ex.</div></div>
        <div class="ac-stat"><div class="ac-stat-val">${a.semanas?.length||0}</div><div class="ac-stat-lbl">Sem.</div></div>
      </div>
      <div class="ac-footer">
        <span class="ac-date">${upd}</span>
        <div class="ac-btns">
          <button class="ac-btn" onclick="event.stopPropagation();abrirDupModal('${a.id}')" title="Duplicar ficha">⎘</button>
          <button class="ac-btn" onclick="event.stopPropagation();compartilharDireto('${a.id}')" title="Copiar link">🔗</button>
          <button class="ac-btn" onclick="event.stopPropagation();verAnameseDireto('${a.id}')" title="Ver anamnese">📋</button>
          <button class="ac-btn danger" onclick="event.stopPropagation();deletarAluno('${a.id}',event)" title="Remover">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('mainContent').innerHTML=`<div class="content-area">
    <div class="dash-kpis">
      <div class="kpi"><div class="kpi-val" style="color:var(--green)">${ativos.length}</div><div class="kpi-lbl">Ativos</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--red)">${inadimplentes.length}</div><div class="kpi-lbl">Inadimplentes</div><div class="kpi-sub">${inadimplentes.map(a=>a.nome.split(' ')[0]).join(', ')||'Nenhum'}</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--yellow)">${precisamReav.length}</div><div class="kpi-lbl">Reavaliação</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--acc)">${anivMes.length}</div><div class="kpi-lbl">Aniversários</div><div class="kpi-sub">${anivMes.map(a=>a.nome.split(' ')[0]).join(', ')||'Nenhum'}</div></div>
    </div>
    <div class="sec-title">Todos os alunos</div>
    <div class="aluno-grid">
      ${cards}
      <div class="aluno-card dash-add-card" onclick="abrirModal()">
        <div style="font-size:24px;color:#2a2a2a">＋</div>
        <div style="font-size:10px;font-weight:700;color:#2a2a2a;text-transform:uppercase;letter-spacing:.05em">Novo aluno</div>
      </div>
    </div>
  </div>`;
}

function verAnameseDireto(aid){
  const a=db.alunos.find(x=>x.id===aid);
  if(a){alunoAtivo=a;renderAlunoList();}
  verAnamnese();
}

async function verAnamnese(){
  if(!alunoAtivo){showToast('⚠️ Selecione um aluno primeiro');return;}
  const mc=document.getElementById('mainContent');
  mc.innerHTML='<div class="content-area"><div style="color:#3a3a3a;padding:40px 0;text-align:center">📋 Buscando anamnese...</div></div>';

  // Busca no Supabase (mais atualizado que o cache)
  let dados={};
  try{
    const ans=await sbGet('anamnese_aluno','aluno_id=eq.'+alunoAtivo.id+'&order=created_at.desc&limit=1');
    if(ans.length&&ans[0].dados){dados=ans[0].dados;}
    else if(Object.keys(alunoAtivo.anamnese||{}).length>0){dados=alunoAtivo.anamnese;}
  }catch(e){dados=alunoAtivo.anamnese||{};}

  if(!Object.keys(dados).length){
    mc.innerHTML=`<div class="content-area">
      <div class="sec-title">📋 Anamnese — ${esc(alunoAtivo.nome)}</div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center">

async function compartilhar(){
  if(!alunoAtivo){showToast('⚠️ Selecione um aluno primeiro');return;}
  showToast('💾 Salvando treino antes de compartilhar...');
  await syncAluno(alunoAtivo);
  const link='https://predubr.github.io/Montador-de-treino/aluno.html?id='+alunoAtivo.id;
  try{
    await navigator.clipboard.writeText(link);
    showToast('✅ Link do treino copiado!');
    mostrarSharePanel(link,'🔗 Link do Treino');
  }catch(e){mostrarSharePanel(link,'🔗 Link do Treino');}
}
async function compartilharDireto(aid){
  const a=db.alunos.find(x=>x.id===aid);if(!a)return;
  await syncAluno(a);
  const link='https://predubr.github.io/Montador-de-treino/aluno.html?id='+aid;
  try{await navigator.clipboard.writeText(link);showToast('✅ Link copiado!');}
  catch(e){mostrarSharePanel(link,'🔗 Link do Treino');}
}
function enviarAnamnese(){
  if(!alunoAtivo){showToast('⚠️ Selecione um aluno primeiro');return;}
  const link='https://predubr.github.io/Montador-de-treino/anamnese.html?id='+alunoAtivo.id+'&editar=1';
  mostrarSharePanel(link,'📋 Link da Anamnese');
}
function mostrarSharePanel(link,titulo){
  document.getElementById('shareToast')?.remove();
  const t=document.createElement('div');t.id='shareToast';
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #c9f50055;border-radius:14px;padding:16px 20px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.8);max-width:380px;width:90%;font-family:Inter,sans-serif';
  t.innerHTML=`<div style="font-size:12px;font-weight:800;color:var(--acc);margin-bottom:10px">${titulo}</div>
    <div style="display:flex;gap:6px">
      <input readonly value="${link}" style="flex:1;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;padding:8px 10px;color:var(--acc);font-size:11px;outline:none;font-family:inherit;word-break:break-all" onclick="this.select()"/>
      <button id="copyBtn" onclick="navigator.clipboard.writeText('${link}').then(()=>{document.getElementById('copyBtn').textContent='✅';setTimeout(()=>document.getElementById('shareToast')?.remove(),1500)})" style="padding:8px 12px;background:var(--acc);border:none;border-radius:8px;color:#111;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap">Copiar</button>
    </div>
    <button onclick="this.closest('#shareToast').remove()" style="position:absolute;top:10px;right:12px;background:none;border:none;color:#444;cursor:pointer;font-size:16px">✕</button>`;
  document.body.appendChild(t);
  t.querySelector('input').select();
  setTimeout(()=>t.remove(),8000);
}

async function verProgresso(){

  mc.innerHTML='<div class="content-area"><div style="color:#3a3a3a;padding:40px 0;text-align:center">📊 Buscando dados de progresso...</div></div>';

    const r=await fetch(SB_URL+'/rest/v1/progresso_aluno?aluno_id=eq.'+alunoAtivo.id+'&order=data.asc&limit=60',{headers:SB_HDR});
    if(r.ok)rows=await r.json();
  }catch(e){}
  const todosEx=alunoAtivo.series.flatMap(s=>s.exercicios);
  const DIAS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const RPE_CORS=['','#34d399','#34d399','#a3e635','#a3e635','#fbbf24','#fbbf24','#f97316','#f97316','#f87171','#f87171'];
  const RPE_LBL=['','Muito leve','Leve','Moderado','Moderado+','Forte','Forte+','Muito forte','Muito forte+','Exaustivo','Máximo'];
  const totalCI=rows.reduce((a,r)=>a+(r.checkin||[]).length,0);
  const comRpe=rows.filter(r=>r.rpe);
  const rpeMedia=comRpe.length?(comRpe.reduce((a,r)=>a+r.rpe,0)/comRpe.length).toFixed(1):null;
  const rowsDesc=[...rows].reverse();
  const histH=rowsDesc.map(r=>{
    const data=r.data?r.data.split('-').reverse().join('/'):'—';const rpe=r.rpe;
    const ciH=(r.checkin||[]).map(i=>`<span style="font-size:10px;padding:2px 6px;border-radius:5px;background:#4ade8022;color:#4ade80;font-weight:700">${DIAS[i]||'?'}</span>`).join('');
    const cargas=r.cargas||{};
    const cargasH=Object.entries(cargas).filter(([,v])=>v&&v.some&&v.some(x=>x)).map(([exId,vals])=>{
      const ex=todosEx.find(x=>x.id===exId);
      const valsStr=(vals||[]).filter(Boolean).join(' | ');
      return`<div style="font-size:11px;color:var(--muted);margin-bottom:2px"><strong style="color:#60a5fa">${esc(ex?.nome||'Exercício')}</strong>: ${esc(valsStr)}</div>`;
    }).join('');
    const feedsH=Object.entries(r.feedbacks_ex||{}).filter(([,v])=>v).map(([exId,txt])=>{const ex=todosEx.find(x=>x.id===exId);return`<div style="font-size:11px;color:var(--muted);margin-bottom:3px"><strong style="color:var(--text)">${esc(ex?.nome||'Ex')}</strong>: ${esc(txt)}</div>`}).join('');
    return`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:${(ciH||r.feedback||feedsH||cargasH)?'8px':'0'}">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--acc)">${data}</div>
        ${rpe?`<span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:${RPE_CORS[rpe]}22;color:${RPE_CORS[rpe]}">RPE ${rpe}/10 — ${RPE_LBL[rpe]}</span>`:''}
        ${ciH?`<div style="display:flex;gap:4px;flex-wrap:wrap">${ciH}</div>`:''}
      </div>
      ${cargasH?`<div style="margin-bottom:6px;padding:8px;background:var(--bg3);border-radius:8px"><div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#3a3a3a;margin-bottom:5px">⚖️ Cargas registradas</div>${cargasH}</div>`:''}
      ${feedsH?`<div style="margin-bottom:4px">${feedsH}</div>`:''}
      ${r.feedback?`<div style="font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:6px;margin-top:4px">💬 ${esc(r.feedback)}</div>`:''}
    </div>`;
  }).join('');

  mc.innerHTML=`<div class="content-area">
    <div class="sec-title" style="margin-bottom:18px">📈 Progresso — ${esc(alunoAtivo.nome)}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px">
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px"><div style="font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#3a3a3a;margin-bottom:4px">Sessões</div><div style="font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--acc)">${rows.length}</div></div>

    </div>
    ${rows.length?`<div class="sec-title">Histórico de sessões</div>${histH}`:'<div style="text-align:center;padding:40px;color:#2a2a2a">Nenhum dado ainda. O aluno não registrou progresso.</div>'}

}

function renderFinanceiro(){

  db.alunos.forEach(a=>{const fin=a.financeiro||{};if(fin.mensalidade)tot+=parseFloat(fin.mensalidade)||0;if(fin.status==='pago')rec+=parseFloat(fin.mensalidade||0);if(fin.status==='atrasado')inad+=parseFloat(fin.mensalidade||0);});
  const fmt=v=>'R$ '+v.toFixed(2).replace('.',',');
  const rows=db.alunos.map(a=>{
    const fin=a.financeiro||{};
    const st=fin.status==='pago'?'<span class="status-pago">✓ Pago</span>':fin.status==='atrasado'?'<span class="status-atr">⚠ Atrasado</span>':fin.status==='vence'?'<span class="status-vence">⏰ Vence</span>':'<span style="color:#3a3a3a">—</span>';
    return`<tr><td style="font-weight:700">${esc(a.nome)}</td><td>${fin.mensalidade?fmt(parseFloat(fin.mensalidade)):'—'}</td><td>${fin.vencimento||'—'}</td><td>${st}</td><td><button class="ac-btn" onclick="editarFin('${a.id}')">Editar</button></td></tr>`;
  }).join('');

    <div class="sec-title" style="margin-bottom:14px">💰 Controle Financeiro</div>
    <div class="fin-cards">
      <div class="fin-card"><div class="fin-val" style="color:var(--acc)">${fmt(tot)}</div><div class="fin-lbl">Potencial mensal</div></div>
      <div class="fin-card"><div class="fin-val" style="color:var(--green)">${fmt(rec)}</div><div class="fin-lbl">Recebido</div></div>
      <div class="fin-card"><div class="fin-val" style="color:var(--red)">${fmt(inad)}</div><div class="fin-lbl">Inadimplente</div></div>
    </div>
    <table class="fin-table"><thead><tr><th>Aluno</th><th>Mensalidade</th><th>Vencimento</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>

function editarFin(aid){
  const a=db.alunos.find(x=>x.id===aid);if(!a)return;
  const fin=a.financeiro||{};
  const mens=prompt('Mensalidade (R$):',fin.mensalidade||'');if(mens===null)return;
  const venc=prompt('Dia de vencimento:',fin.vencimento||'');if(venc===null)return;
  const st=prompt('Status (pago/atrasado/vence/inativo):',fin.status||'pago');if(st===null)return;
  a.financeiro={mensalidade:mens,vencimento:venc,status:st};

}

function renderAgenda(){
  const hoje=new Date();hoje.setHours(0,0,0,0);let items=[];
  db.alunos.forEach(a=>{
    if(a.proximaAvaliacao)items.push({tipo:'Avaliação Física',nome:a.nome,data:a.proximaAvaliacao,cor:'var(--blue)'});
    if(a.proximaTroca)items.push({tipo:'Troca de Treino',nome:a.nome,data:a.proximaTroca,cor:'var(--acc)'});
  });
  items.sort((a,b)=>a.data.localeCompare(b.data));
  const rows=items.map(it=>{
    const d=new Date(it.data+'T00:00:00');
    const diff=Math.round((d-hoje)/(1000*60*60*24));
    const urg=diff<=3&&diff>=0;const pass=diff<0;
    const txt=diff===0?'Hoje!':diff<0?Math.abs(diff)+'d atrás':'em '+diff+'d';
    return`<div class="agenda-item${urg?' urgente':''}">
      <div class="agenda-dot" style="background:${pass?'var(--red)':it.cor}"></div>
      <div class="agenda-info"><div class="agenda-name">${esc(it.nome)}</div><div class="agenda-tipo">${esc(it.tipo)}</div></div>
      <div style="text-align:right"><div class="agenda-data">${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div><div style="font-size:9px;color:${pass?'var(--red)':urg?'var(--yellow)':'#3a3a3a'}">${txt}</div></div>
    </div>`;
  }).join('');
  document.getElementById('mainContent').innerHTML=`<div class="content-area">
    <div class="sec-title" style="margin-bottom:14px">📅 Agenda — Próximos Eventos</div>
    ${items.length?`<div class="agenda-items">${rows}</div>`:'<div style="font-size:13px;color:#2a2a2a;padding:24px 0">Nenhum evento agendado.</div>'}
  </div>`;
}

let dupOrigemId=null;
function abrirDupModal(aid){
  dupOrigemId=aid;
  const orig=db.alunos.find(x=>x.id===aid);if(!orig)return;
  const outros=db.alunos.filter(x=>x.id!==aid);
  if(!outros.length){showToast('⚠️ Você precisa de pelo menos 2 alunos');return;}
  document.getElementById('dupOrigemNome').textContent=orig.nome;
  document.getElementById('dupDestSel').innerHTML=outros.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join('');
  document.getElementById('dupModal').classList.add('open');
}
function fecharDupModal(){document.getElementById('dupModal').classList.remove('open')}
async function confirmarDuplicar(){
  const destId=document.getElementById('dupDestSel').value;
  const orig=db.alunos.find(x=>x.id===dupOrigemId);
  const dest=db.alunos.find(x=>x.id===destId);
  if(!orig||!dest)return;
  const clones=JSON.parse(JSON.stringify(orig.series)).map(s=>({
    ...s,id:'s'+Date.now()+Math.random().toString(36).slice(2),
    exercicios:s.exercicios.map(ex=>({...ex,id:'ex'+Date.now()+Math.random().toString(36).slice(2)}))
  }));
  dest.series=[...dest.series,...clones];
  dest.series.forEach((s,i)=>s.letra=LETRAS[i]||('S'+(i+1)));
  if(document.getElementById('dupSemanas').checked)dest.semanas=JSON.parse(JSON.stringify(orig.semanas));
  saveDB();fecharDupModal();
  await syncAluno(dest);
  renderAlunoList();showToast('✅ Ficha duplicada para '+dest.nome+'!');
}
document.getElementById('dupModal').addEventListener('click',e=>{if(e.target===e.currentTarget)fecharDupModal()});

function importarBackup(){document.getElementById('importFile').click()}
function lerBackup(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      if(!p.db?.alunos)throw new Error('Arquivo inválido');
      if(!confirm('Restaurar backup? Os dados atuais serão mesclados.'))return;
      // Mescla em vez de sobrescrever
      p.db.alunos.forEach(a=>{
        if(!db.alunos.find(x=>x.id===a.id))db.alunos.push(a);
      });
      db.consultoria=p.db.consultoria||db.consultoria;
      saveDB();renderAlunoList();irDash();showToast('✅ Backup restaurado!');
    }catch(x){showToast('❌ Arquivo inválido: '+x.message,4000);}
  };
  r.readAsText(file);e.target.value='';
}

function lerFotoAluno(e){
  const file=e.target.files[0];if(!file||!alunoAtivo)return;
  const r=new FileReader();
  r.onload=ev=>{alunoAtivo.foto=ev.target.result;saveDB();renderAlunoList();syncAlunoMeta(alunoAtivo);};
  r.readAsDataURL(file);
}
